name: MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      RAG_EMBEDDING_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci --ignore-scripts
      - run: npm run check:frontend
      - run: npm run check:frontend:build
      - run: ruff check .
      - run: mypy scripts/evaluate_quality.py
      - run: mypy app/evaluation/acceptance_data.py app/evaluation/acceptance_sql.py app/evaluation/acceptance_retrieval.py app/evaluation/acceptance_suite.py app/evaluation/ranking.py scripts/evaluate_acceptance.py
      - run: mypy --follow-imports=silent app/evaluation/embedding_batch.py app/evaluation/embedding_runtime.py app/evaluation/embedding_rankings.py app/evaluation/embedding_probe.py scripts/run_embedding_acceptance.py
      - run: mypy app/evaluation/predictions.py scripts/export_predictions.py
      - run: mypy app/llm/streaming.py
      - run: mypy app/llm/usage.py app/llm/responses.py
      - run: mypy app/audit/store.py app/workflow/query_audit.py
      - run: mypy app/audit/candidates.py
      - run: mypy app/evaluation/artifacts.py app/evaluation/usage_costs.py scripts/estimate_usage_cost.py
      - run: mypy app/evaluation/inputs.py
      - run: mypy app/evaluation/model_batch.py
      - run: mypy app/evaluation/sqlite_query.py app/evaluation/contract_suite.py scripts/evaluate_sql_contracts.py
      - run: mypy --follow-imports=silent app/evaluation/model_runtime.py scripts/run_model_evaluation.py
      - run: mypy --follow-imports=silent scripts/evaluate_schema_linking.py scripts/evaluate_sql_validation.py
      - run: mypy app/harness app/models app/nodes/execute_sql.py app/nodes/generate_sql.py app/llm/budget.py app/llm/completion.py app/workflow/contracts.py app/knowledge/schema_graph.py app/core/schema_validation.py app/db/query_targets.py app/db/sqlite_source.py app/db/duckdb_source.py app/db/schema_refresh.py
      - run: pytest -m 'not real_database'
      - run: mypy scripts/run_real_db_tests.py
