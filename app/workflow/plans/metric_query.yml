# metric_query workflow plan — MetricFlow semantic layer query
# See SPEC §3.4.2 and implementation-plan §4.9.1
#
# Fixed order: metric_resolve → validate_sql → execute_sql
#
# Resolves explicitly named metrics from the server-owned v1 catalog.
# Single-table aggregates only. No LLM refinement or natural-language inference.

id: metric_query
name: "指标查询（MetricFlow）"
description: "MetricFlow 语义层指标查询，从业务指标名解析到跨方言 SQL 并执行"

plan:
  node_order:
    - id: resolve
      node: metric_resolve
      on_failure: abort
      config:
        timeout_ms: 15000

    - id: validate
      node: validate_sql
      depends_on: [resolve]

    - id: exec
      node: execute_sql
      depends_on: [validate]
      config:
        max_rows: 500
        timeout_ms: 30000

  failure_policy:
    max_retries: 2
    on_exhausted: abort

  evaluation:
    enabled: true
    metrics: [syntax_valid, schema_compliant, execution_success]

  max_iterations: 5
  on_exhausted: force_output
