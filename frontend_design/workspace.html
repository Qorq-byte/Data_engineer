  // Display search results or normal view
  const displayTables = searchResults
    ? searchResults.map(r => ({ ...r, name: r.table_name, comment: r.comment, column_count: r.column_count, db: r.db || 'search', columns: r.matched_columns || [], isSearchResult: true }))
    : filteredTables;

  const totalCols = allTables.reduce((s, t) => s + (t.column_count || 0), 0);
  const loadedDbCount = Object.keys(schemas).length;
  const activeDbInfo = databases.find(d => d.db_id === activeDbId);

  return (
    <div className="flex flex-col gap-5 w-full">
      <PanelHeader title="数据 Schema" desc="跨 11 种数据库方言的表结构内省与向量索引">
        <div className="flex items-center gap-2">
          {/* View mode toggle */}
          <div className="flex items-center gap-0 border border-neutral-200 dark:border-neutral-700 rounded-full overflow-hidden">
            <button className={cn("text-[10px] px-2.5 py-1 bg-transparent border-none cursor-pointer transition-all", viewMode === "tables" ? "bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900" : "text-neutral-400")} onClick={() => setViewMode("tables")}>表</button>
            <button className={cn("text-[10px] px-2.5 py-1 bg-transparent border-none cursor-pointer transition-all", viewMode === "compare" ? "bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900" : "text-neutral-400")} onClick={() => setViewMode("compare")}>对比</button>
          </div>
          {activeDbId && (
            <button className="btn-outline flex items-center gap-1.5" onClick={() => handleRefreshSchema(activeDbId)} disabled={refreshingDb === activeDbId}>
              {refreshingDb === activeDbId ? (
                <svg className="animate-spin h-3.5 w-3.5" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
              ) : (
                <IconRefresh className="h-3.5 w-3.5" />
              )}
              刷新
            </button>
          )}
          {lastRefreshTime[activeDbId] && (
            <span className="text-[10px] text-neutral-400">Updated: {lastRefreshTime[activeDbId]}</span>
          )}
        </div>
      </PanelHeader>

      {/* Offline indicator */}
      {isOffline && (
        <div className="flex items-center gap-2 text-xs text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 px-3 py-2 rounded-lg">
          <IconWifiOff className="h-3.5 w-3.5 flex-shrink-0" /> 离线模式 — 显示演示数据
        </div>
      )}

      {/* Schema errors */}
      {Object.keys(schemaErrors).length > 0 && Object.entries(schemaErrors).map(([dbId, err]) => (
        <div key={dbId} className="flex items-start gap-2 text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-500/10 px-3 py-2 rounded-lg">
          <IconAlert className="h-3.5 w-3.5 flex-shrink-0 mt-0.5" />
          <div>
            <span className="font-mono text-[10px]">{dbId}</span>
            <span className="mx-1">—</span>
            <span>{err}</span>
          </div>
        </div>
      ))}

      <div className="grid grid-cols-3 gap-3">
        {[["11", "数据库方言"], [String(allTables.length), "数据表"], [String(totalCols || "1.2K"), "已索引列"]].map(([v, l]) => (
          <Card key={l} className="p-4 text-center">
            <div className="text-2xl font-semibold text-neutral-900 dark:text-neutral-100">{v}</div>
            <div className="text-xs text-neutral-400 mt-0.5">{l}</div>
          </Card>
        ))}
      </div>

      {/* Database selector with status */}
      {databases.length > 0 && (
        <div className="flex gap-2 flex-wrap items-center">
          <span className="text-xs text-neutral-400 mr-1">数据库:</span>
          {databases.map(d => (
            <button key={d.db_id}
              className={cn("btn-outline text-xs flex items-center gap-1.5", activeDbId === d.db_id && "active")}
              onClick={() => handleDbSwitch(d.db_id)}>
              <span className={cn("w-1.5 h-1.5 rounded-full flex-shrink-0", d.status === "connected" ? "bg-emerald-500" : "bg-red-400")} />
              {d.alias || d.database_name || d.db_id}
              <span className="text-[10px] text-neutral-400">({d.db_type})</span>
            </button>
          ))}
        </div>
      )}

      {activeDbInfo && (
        <div className="text-xs text-neutral-400 flex items-center gap-2 flex-wrap">
          <span className="font-mono bg-gray-50 dark:bg-neutral-800 px-1.5 py-0.5 rounded">ID: {activeDbInfo.db_id}</span>
          {activeDbInfo.host && <span>Host: {activeDbInfo.host}{activeDbInfo.port ? ':' + activeDbInfo.port : ''}</span>}
          {activeDbInfo.database_name && <span>DB: {activeDbInfo.database_name}</span>}
        </div>
      )}

      <div className="relative">
        <input className="input-light pl-9" placeholder="搜索表名或列名…" value={searchQuery}
          onChange={e => handleSearchInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') handleSearch(); }} />
        <div className="absolute left-3 top-1/2 -translate-y-1/2 cursor-pointer" onClick={handleSearch}>
          <IconSearch className="h-4 w-4 text-neutral-400" />
        </div>
        {loading && <div className="absolute right-3 top-1/2 -translate-y-1/2"><svg className="animate-spin h-4 w-4 text-neutral-400" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg></div>}
        {searchResults && searchResults.length > 0 && (
          <button className="absolute right-9 top-1/2 -translate-y-1/2 text-[10px] text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300 bg-transparent border-none cursor-pointer" onClick={() => { setSearchQuery(""); setSearchResults(null); }}>
            清除
          </button>
        )}
      </div>

      <div className="flex gap-2 flex-wrap">
        {["全部", ...databases.map(d => d.alias || d.db_id)].map(db => (
          <button key={db} className={cn("btn-outline", dbFilter === db && "active")} onClick={() => setDbFilter(db)}>{db}{db !== "全部" ? ` (${databases.find(d => (d.alias||d.db_id) === db)?.db_type || ''})` : ''}</button>
        ))}
      </div>

      {loadingDb && <p className="text-sm text-neutral-400 text-center py-4">加载 Schema…</p>}

      {searchResults && searchResults.length === 0 && !loading && (
        <div className="text-center py-8">
          <IconSearch className="h-8 w-8 text-neutral-300 dark:text-neutral-600 mx-auto mb-2" />
          <p className="text-sm text-neutral-400 m-0">未找到匹配的表或列</p>
        </div>
      )}

      {displayTables.length === 0 && !loading && !loadingDb && (
        <div className="text-center py-8">
          <IconDatabase className="h-8 w-8 text-neutral-300 dark:text-neutral-600 mx-auto mb-2" />
          <p className="text-sm text-neutral-400 m-0">暂无数据表</p>
          <p className="text-xs text-neutral-400 mt-1 m-0">请先连接数据库</p>
        </div>
      )}

      <div className="flex-1 overflow-auto space-y-2 min-h-0">
        {displayTables.map(t => (
          <Card key={t.name + (t.db || '')}
                className={cn("p-4 cursor-pointer transition-all hover:shadow-md", expanded === t.name && t.name && "ring-2 ring-neutral-900/10 dark:ring-neutral-100/10")}
                onClick={() => setExpanded(expanded === t.name && t.name ? null : t.name)}>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3 min-w-0">
                <span className="text-neutral-400 text-xs font-mono bg-gray-100 dark:bg-neutral-800 px-1.5 py-0.5 rounded flex-shrink-0">{t.db || t.dbType || ''}</span>
                <span className="text-neutral-900 dark:text-neutral-100 text-sm font-semibold">{t.name}</span>
                <span className="text-neutral-400 text-xs hidden sm:inline">{t.comment || ''}</span>
                {t.isSearchResult && <span className="text-[10px] text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 px-1.5 py-0.5 rounded">搜索结果</span>}
              </div>
              <div className="flex items-center gap-4 text-xs text-neutral-400 flex-shrink-0">
                <span>{t.column_count || (t.columns?.length || 0)} 列</span>
                {t.row_count_estimate != null && <span>{(t.row_count_estimate / 1000).toFixed(1)}K 行</span>}
                <IconChevron className={cn("h-4 w-4 transition-transform", expanded === t.name && t.name && "rotate-90")} />
              </div>
            </div>
            {expanded === t.name && t.name && (
              <div className="mt-3 pt-3 border-t border-neutral-100 dark:border-neutral-800 space-y-1.5 pl-1">
                {(t.columns || []).slice(0, 15).map(c => (
                  <div key={c.name} className="flex items-center justify-between text-xs">
                    <span className="flex items-center gap-1.5">
                      <span className="text-neutral-700 dark:text-neutral-300 font-mono">{c.name}</span>
                      {c.is_primary_key && <span className="text-[9px] text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 px-1 rounded">PK</span>}
                      {c.is_foreign_key && <span className="text-[9px] text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-500/10 px-1 rounded">FK</span>}
                    </span>
                    <span className="flex items-center gap-2">
                      {c.comment && <span className="text-neutral-400">{c.comment}</span>}
                      <span className="text-neutral-400 font-mono">{c.type}</span>
                    </span>
                  </div>
                ))}
                {(t.columns || []).length > 15 && (
                  <div className="text-neutral-300 dark:text-neutral-600 italic text-xs">… 等 {(t.columns || []).length} 列</div>
                )}
                {(!t.columns || t.columns.length === 0) && (
                  <div className="text-neutral-400 text-xs italic">点击刷新获取完整列信息</div>
                )}
              </div>
            )}
          </Card>
        ))}
      </div>

      {/* Schema comparison view */}
      {viewMode === "compare" && Object.keys(schemas).length >= 2 && (
        <Card className="p-4">
          <h3 className="text-sm font-semibold text-neutral-900 dark:text-neutral-100 m-0 mb-3">跨库 Schema 对比</h3>
          <div className="overflow-auto">
            <table className="table-light text-xs">
              <thead>
                <tr>
                  <th>表名</th>
                  {Object.keys(schemas).map(dbId => (
                    <th key={dbId}>{schemas[dbId]?.database_name || dbId}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {(() => {
                  // Collect all table names across all databases
                  const allTableNames = new Set();
                  Object.values(schemas).forEach(s => {
                    if (s && s.tables) Object.keys(s.tables).forEach(n => allTableNames.add(n));
                  });
                  return [...allTableNames].sort().map(tableName => (
                    <tr key={tableName}>
                      <td className="font-mono text-xs">{tableName}</td>
                      {Object.keys(schemas).map(dbId => {
                        const t = schemas[dbId]?.tables?.[tableName];
                        return (
                          <td key={dbId}>
                            {t ? (
                              <span className="flex items-center gap-1">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500" />
                                <span>{t.column_count || 0} 列</span>
                              </span>
                            ) : (
                              <span className="flex items-center gap-1 text-neutral-400">
                                <span className="w-1.5 h-1.5 rounded-full bg-neutral-300 dark:bg-neutral-600" />
                                <span>—</span>
                              </span>
                            )}
                          </td>
                        );
                      })}
                    </tr>
                  ));
                })()}
              </tbody>
            </table>
          </div>
        </Card>
      )}
    </div>
  );
};

/* ════════════════════════════════════════════════════════════════════════════
   3. 领域知识 — fetches from GET /api/v1/domains, glossary, rules + full CRUD
   ════════════════════════════════════════════════════════════════════════════ */

// Shared modal form and field components (defined at module level to prevent re-creation)
const ModalForm = ({ title, onClose, onSave, saving, children }) => {
  const formRef = React.useRef(null);
  React.useEffect(() => {
    const handleMouseDown = (e) => {
      if (formRef.current && !formRef.current.contains(e.target)) {
        onClose();
      }
    };
    document.addEventListener('mousedown', handleMouseDown);
    // Auto-focus the first input/textarea in the form
    if (formRef.current) {
      const firstInput = formRef.current.querySelector('input, textarea');
      if (firstInput) {
        setTimeout(() => firstInput.focus(), 50);
      }
    }
    return () => document.removeEventListener('mousedown', handleMouseDown);
  }, [onClose]);
  return React.createElement('div', { className: "fixed inset-0 z-50 flex items-center justify-center bg-black/30" },
    React.createElement(Card, { ref: formRef, className: "w-full max-w-lg p-5 mx-4 max-h-[80vh] overflow-auto" },
      React.createElement('div', { className: "flex items-center justify-between mb-4" },
        React.createElement('h3', { className: "text-sm font-semibold text-neutral-900 dark:text-neutral-100 m-0" }, title),
        React.createElement('button', { className: "icon-btn", onClick: onClose }, React.createElement(IconClose, { className: "h-4 w-4" }))
      ),
      React.createElement('div', { className: "flex flex-col gap-3" }, children),
      React.createElement('div', { className: "flex gap-2 mt-4 justify-end" },
        React.createElement('button', { className: "btn-outline", onClick: onClose }, "取消"),
        React.createElement('button', { className: "btn-dark", onClick: onSave, disabled: saving }, saving ? "保存中…" : "保存")
      )
    )
  );
};

const ModalField = ({ label, value, onChange, placeholder, type, isTextarea }) => {
  const isComposing = React.useRef(false);
  const handleCompositionStart = () => { isComposing.current = true; };
  const handleCompositionEnd = (e) => {
    isComposing.current = false;
  };
  const handleChange = (e) => {
    onChange(e.target.value);
  };
  const handleBlur = () => { isComposing.current = false; };
  return React.createElement('div', null,
    React.createElement('label', { className: "text-xs font-medium text-neutral-500 dark:text-neutral-400 block mb-1" }, label),
    isTextarea
      ? React.createElement('textarea', { className: "input-light text-sm", rows: 3, value: value, onChange: handleChange, onCompositionStart: handleCompositionStart, onCompositionEnd: handleCompositionEnd, onBlur: handleBlur, placeholder: placeholder || "" })
      : React.createElement('input', { type: type || "text", className: "input-light text-sm", value: value, onChange: handleChange, onCompositionStart: handleCompositionStart, onCompositionEnd: handleCompositionEnd, onBlur: handleBlur, placeholder: placeholder || "" })
  );
};

const DomainPanel = () => {
  const [tab, setTab] = useState("terms");
  const [activeDomain, setActiveDomain] = useState(null);
  const [domains, setDomains] = useState([]);
  const [glossary, setGlossary] = useState([]);
  const [rules, setRules] = useState([]);
  const [loading, setLoading] = useState(false);
  const [showNewDomain, setShowNewDomain] = useState(false);
  const [showTermForm, setShowTermForm] = useState(false);
  const [showRuleForm, setShowRuleForm] = useState(false);
  const [editTerm, setEditTerm] = useState(null); // term being edited (null = new)
  const [editRule, setEditRule] = useState(null); // rule being edited (null = new)
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);
  const notify = useNotify();

  // ── New domain form ──
  const [newDomain, setNewDomain] = useState({ name: "", label_zh: "", label_en: "", description_zh: "", description_en: "", keywords: "" });

  // ── Term form ──
  const [termForm, setTermForm] = useState({ term: "", term_en: "", description: "", expression: "", mapping_type: "derived_column", tags: "" });

  // ── Rule form ──
  const [ruleForm, setRuleForm] = useState({ id: "", description: "", pattern: "", sql_template: "", enforce: "" });

  const fetchDomains = () => {
    api.domains().then(data => {
      const ds = (data.domains || []).map(d => ({
        name: d.label?.zh || d.name,
        id: d.name,
        terms: d.glossary_count || 0,
        rules: d.rules_count || 0,
        keywords: d.keywords || [],
        isActive: d.is_active,
        description: d.description?.zh || '',
      }));
      setDomains(ds);
      // Use domain id (d.name) for activeDomain, not display name
      if (!activeDomain || !ds.find(d => d.id === activeDomain)) {
        const active = ds.find(d => d.isActive) || ds[0];
        if (active) setActiveDomain(active.id);
      }
    }).catch(() => {});
  };

  useEffect(() => { fetchDomains(); }, []);

  useEffect(() => {
    if (!activeDomain) return;
    // activeDomain is now the domain id (d.name from API)
    setLoading(true);
    Promise.all([
      api.glossary(activeDomain).catch(() => ({ terms: [] })),
      api.rules(activeDomain).catch(() => ({ rules: [] })),
    ]).then(([g, r]) => {
      setGlossary(g.terms || []);
      setRules(r.rules || []);
    }).finally(() => setLoading(false));
  }, [activeDomain]);

  const showMsg = (type, text) => { setMsg({ type, text }); setTimeout(() => setMsg(null), 3000); };

  // ── Domain CRUD ──
  const handleCreateDomain = async () => {
    if (!newDomain.name.trim()) { showMsg("err", "请输入领域名称"); return; }
    setSaving(true);
    try {
      await api.createDomain({
        name: newDomain.name.trim(),
        label_zh: newDomain.label_zh.trim() || newDomain.name.trim(),
        label_en: newDomain.label_en.trim() || newDomain.name.trim(),
        description_zh: newDomain.description_zh.trim(),
        description_en: newDomain.description_en.trim(),
        keywords: newDomain.keywords.split(/[,，]/).map(k => k.trim()).filter(Boolean),
      });
      showMsg("ok", "领域已创建");
      setShowNewDomain(false);
      setNewDomain({ name: "", label_zh: "", label_en: "", description_zh: "", description_en: "", keywords: "" });
      fetchDomains();
    } catch(e) { showMsg("err", `创建失败: ${e.message}`); }
    finally { setSaving(false); }
  };

  // ── Term CRUD ──
  const openNewTerm = () => { setEditTerm(null); setTermForm({ term: "", term_en: "", description: "", expression: "", mapping_type: "derived_column", tags: "" }); setShowTermForm(true); };
  const openEditTerm = (t) => {
    setEditTerm(t);
    setTermForm({
      term: t.term || "", term_en: t.term_en || "", description: t.description || "",
      expression: t.mapping?.expression || "", mapping_type: t.mapping?.type || "derived_column",
      tags: (t.tags || []).join(", "),
    });
    setShowTermForm(true);
  };

  const handleSaveTerm = async () => {
    if (!termForm.term.trim()) { showMsg("err", "请输入术语名称"); return; }
    if (!activeDomain) return;
    setSaving(true);
    try {
      if (editTerm) {
        // Use PUT to update the existing term
        await api.updateGlossaryTerm(activeDomain, editTerm.term, {
          term: termForm.term.trim(),
          term_en: termForm.term_en.trim(),
          description: termForm.description.trim(),
          expression: termForm.expression.trim(),
          mapping_type: termForm.mapping_type,
          tags: termForm.tags.split(/[,，]/).map(k => k.trim()).filter(Boolean),
        });
      } else {
        await api.addGlossaryTerm(activeDomain, {
          term: termForm.term.trim(),
          term_en: termForm.term_en.trim(),
          description: termForm.description.trim(),
          expression: termForm.expression.trim(),
          mapping_type: termForm.mapping_type,
          tags: termForm.tags.split(/[,，]/).map(k => k.trim()).filter(Boolean),
        });
      }
      showMsg("ok", editTerm ? "术语已更新" : "术语已添加");
      setShowTermForm(false);
      const g = await api.glossary(activeDomain).catch(() => ({ terms: [] }));
      setGlossary(g.terms || []);
      fetchDomains();
    } catch(e) { showMsg("err", `保存失败: ${e.message}`); }
    finally { setSaving(false); }
  };

  const handleDeleteTerm = async (term) => {
    if (!activeDomain) return;
    if (!confirm(`确定要删除术语 "${term}" 吗？`)) return;
    try {
      await api.deleteGlossaryTerm(activeDomain, term);
      showMsg("ok", "术语已删除");
      setGlossary(prev => prev.filter(t => t.term !== term));
      fetchDomains();
    } catch(e) { showMsg("err", `删除失败: ${e.message}`); }
  };

  // ── Rule CRUD ──
  const openNewRule = () => { setEditRule(null); setRuleForm({ id: "", description: "", pattern: "", sql_template: "", enforce: "" }); setShowRuleForm(true); };
  const openEditRule = (r) => {
    setEditRule(r);
    setRuleForm({
      id: r.id || "", description: r.description || "", pattern: r.pattern || "",
      sql_template: r.sql_template || "", enforce: (r.enforce || []).join(", "),
    });
    setShowRuleForm(true);
  };

  const handleSaveRule = async () => {
    if (!ruleForm.id.trim()) { showMsg("err", "请输入规则 ID"); return; }
    if (!activeDomain) return;
    setSaving(true);
    try {
      if (editRule) {
        // Use PUT to update the existing rule
        await api.updateRule(activeDomain, editRule.id, {
          id: ruleForm.id.trim(),
          description: ruleForm.description.trim(),
          pattern: ruleForm.pattern.trim(),
          sql_template: ruleForm.sql_template.trim(),
          enforce: ruleForm.enforce.split(/[,，]/).map(k => k.trim()).filter(Boolean),
        });
      } else {
        await api.addRule(activeDomain, {
          id: ruleForm.id.trim(),
          description: ruleForm.description.trim(),
          pattern: ruleForm.pattern.trim(),
          sql_template: ruleForm.sql_template.trim(),
          enforce: ruleForm.enforce.split(/[,，]/).map(k => k.trim()).filter(Boolean),
        });
      }
      showMsg("ok", editRule ? "规则已更新" : "规则已添加");
      setShowRuleForm(false);
      const r = await api.rules(activeDomain).catch(() => ({ rules: [] }));
      setRules(r.rules || []);
      fetchDomains();
    } catch(e) { showMsg("err", `保存失败: ${e.message}`); }
    finally { setSaving(false); }
  };

  const handleDeleteRule = async (ruleId) => {
    if (!activeDomain) return;
    if (!confirm(`确定要删除规则 "${ruleId}" 吗？`)) return;
    try {
      await api.deleteRule(activeDomain, ruleId);
      showMsg("ok", "规则已删除");
      setRules(prev => prev.filter(r => r.id !== ruleId));
      fetchDomains();
    } catch(e) { showMsg("err", `删除失败: ${e.message}`); }
  };

  const handleDeleteDomain = async (domain) => {
    if (!confirm(`确定要删除领域 "${domain.name}" 吗？此操作不可撤销。`)) return;
    try {
      await api.deleteDomain(domain.id);
      showMsg("ok", `领域 "${domain.name}" 已删除`);
      // If the deleted domain was active, switch to another
      if (activeDomain === domain.id) {
        setActiveDomain(null);
      }
      fetchDomains();
    } catch(e) { showMsg("err", `删除失败: ${e.message}`); }
  };

  return (
    <div className="flex flex-col gap-5 w-full">
      <PanelHeader title="领域知识" desc="YAML 定义的业务术语、别名映射与计算规则">
        <button className="btn-outline" onClick={() => setShowNewDomain(true)}>+ 新建领域</button>
      </PanelHeader>

      {/* Status message */}
      {msg && (
        <div className={cn("text-xs px-3 py-2 rounded-lg font-medium",
          msg.type === "ok" ? "bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400" : "bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400")}>
          {msg.text}
        </div>
      )}

      {/* New Domain Modal */}
      {showNewDomain && (
        <ModalForm title="新建领域" onClose={() => setShowNewDomain(false)} onSave={handleCreateDomain} saving={saving}>
          <ModalField label="领域标识 (ID)" value={newDomain.name} onChange={v => setNewDomain(s => ({...s, name: v}))} placeholder="例如: healthcare" />
          <ModalField label="中文名称" value={newDomain.label_zh} onChange={v => setNewDomain(s => ({...s, label_zh: v}))} placeholder="例如: 医疗健康" />
          <ModalField label="英文名称" value={newDomain.label_en} onChange={v => setNewDomain(s => ({...s, label_en: v}))} placeholder="例如: Healthcare" />
          <ModalField label="中文描述" value={newDomain.description_zh} onChange={v => setNewDomain(s => ({...s, description_zh: v}))} placeholder="领域描述（中文）" isTextarea />
          <ModalField label="英文描述" value={newDomain.description_en} onChange={v => setNewDomain(s => ({...s, description_en: v}))} placeholder="Domain description (EN)" isTextarea />
          <ModalField label="关键词（逗号分隔）" value={newDomain.keywords} onChange={v => setNewDomain(s => ({...s, keywords: v}))} placeholder="医疗, 患者, 诊断" />
        </ModalForm>
      )}

      {/* Term Form Modal */}
      {showTermForm && (
        <ModalForm title={editTerm ? "编辑术语" : "添加术语"} onClose={() => setShowTermForm(false)} onSave={handleSaveTerm} saving={saving}>
          <ModalField label="术语名称 *" value={termForm.term} onChange={v => setTermForm(s => ({...s, term: v}))} placeholder="例如: GMV" />
          <ModalField label="英文名称" value={termForm.term_en} onChange={v => setTermForm(s => ({...s, term_en: v}))} placeholder="例如: Gross Merchandise Volume" />
          <ModalField label="描述" value={termForm.description} onChange={v => setTermForm(s => ({...s, description: v}))} placeholder="术语的业务含义" isTextarea />
          <ModalField label="SQL 表达式" value={termForm.expression} onChange={v => setTermForm(s => ({...s, expression: v}))} placeholder="例如: SUM(order_amount) WHERE status='paid'" />
          <div>
            <label className="text-xs font-medium text-neutral-500 dark:text-neutral-400 block mb-1">映射类型</label>
            <select className="input-light text-sm py-2" value={termForm.mapping_type} onChange={e => setTermForm(s => ({...s, mapping_type: e.target.value}))}>
              <option value="derived_column">派生列</option>
              <option value="filter_condition">过滤条件</option>
              <option value="table_ref">表引用</option>
            </select>
          </div>
          <ModalField label="标签（逗号分隔）" value={termForm.tags} onChange={v => setTermForm(s => ({...s, tags: v}))} placeholder="电商, KPI" />
        </ModalForm>
      )}

      {/* Rule Form Modal */}
      {showRuleForm && (
        <ModalForm title={editRule ? "编辑规则" : "添加规则"} onClose={() => setShowRuleForm(false)} onSave={handleSaveRule} saving={saving}>
          <ModalField label="规则 ID *" value={ruleForm.id} onChange={v => setRuleForm(s => ({...s, id: v}))} placeholder="例如: rule_gmv" />
          <ModalField label="描述" value={ruleForm.description} onChange={v => setRuleForm(s => ({...s, description: v}))} placeholder="规则说明" isTextarea />
          <ModalField label="匹配模式 (Regex)" value={ruleForm.pattern} onChange={v => setRuleForm(s => ({...s, pattern: v}))} placeholder="例如: GMV|成交额" />
          <ModalField label="SQL 模板" value={ruleForm.sql_template} onChange={v => setRuleForm(s => ({...s, sql_template: v}))} placeholder="例如: SUM(order_amount) WHERE status='paid'" />
          <ModalField label="强制约束（逗号分隔）" value={ruleForm.enforce} onChange={v => setRuleForm(s => ({...s, enforce: v}))} placeholder="必须排除未支付订单, 分母必须去重用户" />
        </ModalForm>
      )}

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        {domains.map(d => (
          <Card key={d.id}
                className={cn("p-4 cursor-pointer transition-all hover:shadow-md relative group", activeDomain === d.id && "border-neutral-900 dark:border-neutral-300 ring-1 ring-neutral-900/10 dark:ring-neutral-100/10")}
                onClick={() => setActiveDomain(d.id)}>
            <div className="flex items-center justify-between mb-2">
              <span className="text-neutral-900 dark:text-neutral-100 text-sm font-medium">{d.name}</span>
              <div className="flex items-center gap-1">
                {activeDomain === d.id && <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-dot" />}
                <button className="icon-btn !p-1 opacity-0 group-hover:opacity-100 transition-opacity" title="删除领域"
                  onClick={e => { e.stopPropagation(); handleDeleteDomain(d); }}>
                  <svg className="h-3.5 w-3.5 text-red-400 hover:text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14" />
                  </svg>
                </button>
              </div>
            </div>
            <div className="flex gap-3 text-xs text-neutral-400">
              <span>{d.terms} 术语</span>
              <span>{d.rules} 规则</span>
            </div>
          </Card>
        ))}
      </div>

      <div className="flex items-center gap-1 border-b border-neutral-200 dark:border-neutral-700">
        {[["terms", "术语映射"], ["rules", "业务规则"]].map(([k, l]) => (
          <button key={k}
            className={cn("px-4 py-2 text-sm bg-transparent border-none cursor-pointer transition-all -mb-px",
              tab === k ? "text-neutral-900 dark:text-neutral-100 font-medium border-b-2 border-neutral-900 dark:border-neutral-100"
                       : "text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-300")}
            onClick={() => setTab(k)}>{l}</button>
        ))}
        <div className="flex-1" />
        {tab === "terms" && <button className="btn-outline !py-1 !px-3 !text-xs" onClick={openNewTerm}>+ 添加术语</button>}
        {tab === "rules" && <button className="btn-outline !py-1 !px-3 !text-xs" onClick={openNewRule}>+ 添加规则</button>}
      </div>

      {loading && <p className="text-sm text-neutral-400 text-center py-4">加载中…</p>}

      <div className="flex-1 overflow-auto space-y-2 min-h-0">
        {tab === "terms" && glossary.map(t => (
          <Card key={t.term} className="p-4 group">
            <div className="flex items-center justify-between mb-1.5">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-neutral-900 dark:text-neutral-100 text-sm font-mono font-semibold">{t.term}</span>
                {t.term_en && <span className="text-xs text-neutral-400">{t.term_en}</span>}
                {t.tags && t.tags.map(tag => <span key={tag} className="text-[10px] text-neutral-400 bg-gray-100 dark:bg-neutral-800 px-1.5 py-0.5 rounded">{tag}</span>)}
              </div>
              <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                <button className="icon-btn !p-1" title="编辑" onClick={() => openEditTerm(t)}><svg className="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
                <button className="icon-btn !p-1 !text-red-400 hover:!text-red-600" title="删除" onClick={() => handleDeleteTerm(t.term)}><IconTrash className="h-3.5 w-3.5" /></button>
              </div>
            </div>
            <p className="text-neutral-500 dark:text-neutral-400 text-xs m-0 mb-2">{t.description}</p>
            {t.mapping && (
              <div className="bg-gray-50 dark:bg-neutral-800 rounded p-2 text-xs font-mono text-neutral-600 dark:text-neutral-400">
                {t.mapping.expression}
                <span className="ml-2 text-[10px] text-neutral-400">({t.mapping.type})</span>
              </div>
            )}
          </Card>
        ))}
        {tab === "rules" && rules.map(r => (
          <Card key={r.id} className="p-4 group">
            <div className="flex items-center justify-between mb-1.5">
              <div className="flex items-center gap-2">
                <span className="text-neutral-400 text-xs font-mono">{r.id}</span>
                <span className="text-[10px] text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 px-1.5 py-0.5 rounded-full">启用中</span>
              </div>
              <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                <button className="icon-btn !p-1" title="编辑" onClick={() => openEditRule(r)}><svg className="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
                <button className="icon-btn !p-1 !text-red-400 hover:!text-red-600" title="删除" onClick={() => handleDeleteRule(r.id)}><IconTrash className="h-3.5 w-3.5" /></button>
              </div>
            </div>
            <p className="text-neutral-900 dark:text-neutral-100 text-sm font-mono m-0 mb-1">{r.sql_template || r.pattern}</p>
            <p className="text-neutral-500 dark:text-neutral-400 text-xs m-0">{r.description}</p>
            {r.enforce && r.enforce.length > 0 && (
              <div className="flex gap-1.5 mt-2 flex-wrap">
                {r.enforce.map((e, i) => <span key={i} className="text-[10px] text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 px-1.5 py-0.5 rounded">{e}</span>)}
              </div>
            )}
          </Card>
        ))}
        {!loading && tab === "terms" && glossary.length === 0 && <p className="text-sm text-neutral-400 text-center py-8">暂无术语数据，点击「+ 添加术语」创建</p>}
        {!loading && tab === "rules" && rules.length === 0 && <p className="text-sm text-neutral-400 text-center py-8">暂无业务规则，点击「+ 添加规则」创建</p>}
      </div>
    </div>
  );
};

/* ════════════════════════════════════════════════════════════════════════════
   4. SQL 工作台 — execute SQL via POST /api/v1/query
   ════════════════════════════════════════════════════════════════════════════ */
const WorkbenchPanel = ({ sql, setSql }) => {
  const [output, setOutput] = useState(null);
  const [activeTab, setActiveTab] = useState(null);
  const [dialect, setDialect] = useState("postgres");
  const [targetDialect, setTargetDialect] = useState("mysql");
  const [loading, setLoading] = useState(false);
  const [database, setDatabase] = useState("");
  const [dbList, setDbList] = useState([]);
  const notify = useNotify();

  // Fetch available databases to set the active one
  useEffect(() => {
    api.databases().then(data => {
      const dbs = data.databases || [];
      setDbList(dbs);
      if (dbs.length > 0 && !database) {
        setDatabase(dbs[0].db_id);
      }
    }).catch(() => {});
  }, []);

  const handleTab = async (tab) => {
    setActiveTab(tab);
    if (tab === "execute") {
      if (!sql.trim()) {
        setOutput({ type: "error", message: "请输入 SQL 语句" });
        return;
      }
      setLoading(true);
      try {
        const result = await api.execute({
          sql: sql,
          dialect,
          database: database,
          max_rows: 100,
        });
        if (result.status === 'success') {
          setOutput({
            type: "result",
            rows: result.rows || [],
            columns: result.columns || [],
            rowCount: result.row_count || 0,
            elapsed: result.elapsed || '',
            truncated: result.truncated || false,
          });
          notify(`查询完成: ${result.row_count || 0} 行${result.elapsed ? ' · ' + result.elapsed : ''}`, 'ok', 2500);
        } else {
          const errMsg = result.message || (result.errors && result.errors.join('; ')) || "执行失败";
          setOutput({
            type: "error",
            message: errMsg,
          });
          notify(errMsg, 'error');
        }
      } catch(e) {
        setOutput({
          type: "error",
          message: `执行失败: ${e.message}`,
        });
        notify(`SQL 执行失败: ${e.message}`, 'error');
      } finally { setLoading(false); }
    } else if (tab === "format") {
      setLoading(true);
      try {
        const result = await api.sqlFormat({ sql, dialect });
        if (result.status === 'formatted' && result.formatted_sql) {
          setSql(result.formatted_sql);
          setOutput({ type: "info", message: "SQL 已格式化" + (result.note ? ` (${result.note})` : '') });
          notify("SQL 格式化完成", 'ok', 2000);
        } else {
          setOutput({ type: "error", message: result.message || "格式化失败" });
          notify(result.message || "格式化失败", 'error');
        }
      } catch(e) {
        setOutput({ type: "error", message: `格式化失败: ${e.message}` });
        notify(`格式化失败: ${e.message}`, 'error');
      } finally { setLoading(false); }
    } else if (tab === "explain") {
      setLoading(true);
      try {
        const result = await api.sqlExplain({ sql, dialect });
        if (result.status === 'analyzed') {
          setOutput({
            type: "explain",
            plan: result.plan_text,
            details: {
              tables: result.tables,
              joins: result.joins,
              whereConditions: result.where_conditions,
              hasAggregation: result.has_aggregation,
              hasSubquery: result.has_subquery,
              hasCTE: result.has_cte,
              warnings: result.warnings,
            },
          });
          notify("SQL 分析完成", 'ok', 2000);
        } else if (result.status === 'unavailable') {
          setOutput({ type: "info", message: result.message || "EXPLAIN 功能不可用" });
          notify(result.message || "EXPLAIN 功能不可用", 'warn', 3000);
        } else {
          setOutput({ type: "error", message: result.message || "分析失败" });
          notify(result.message || "SQL 分析失败", 'error');
        }
      } catch(e) {
        setOutput({ type: "error", message: `分析失败: ${e.message}` });
        notify(`SQL 分析失败: ${e.message}`, 'error');
      } finally { setLoading(false); }
    } else if (tab === "translate") {
      setLoading(true);
      try {
        const result = await api.sqlTranslate({ sql, dialect, target_dialect: targetDialect });
        if (result.status === 'translated' && result.translated_sql) {
          setSql(result.translated_sql);
          setDialect(targetDialect);
          setOutput({ type: "info", message: `已从 ${result.source_dialect} 翻译为 ${result.target_dialect}` });
          notify(`已翻译为 ${result.target_dialect}`, 'ok', 2000);
        } else if (result.status === 'unavailable') {
          setOutput({ type: "info", message: result.message || "翻译功能不可用" });
          notify(result.message || "翻译功能不可用", 'warn', 3000);
        } else {
          setOutput({ type: "error", message: result.message || "翻译失败" });
          notify(result.message || "翻译失败", 'error');
        }
      } catch(e) {
        setOutput({ type: "error", message: `翻译失败: ${e.message}` });
        notify(`翻译失败: ${e.message}`, 'error');
      } finally { setLoading(false); }
    } else if (tab === "validate") {
      setLoading(true);
      try {
        const result = await api.sqlValidate({ sql, dialect });
        setOutput({
          type: "validate",
          status: result.status,
          syntaxOk: result.syntax_ok,
          errors: result.errors || [],
          warnings: result.warnings || [],
        });
        if (result.syntax_ok) {
          notify("SQL 语法验证通过", 'ok', 2000);
        } else {
          notify("SQL 语法验证失败", 'error', 3000);
        }
      } catch(e) {
        setOutput({ type: "error", message: `验证失败: ${e.message}` });
        notify(`验证失败: ${e.message}`, 'error');
      } finally { setLoading(false); }
    }
  };

  const tabs = [
    { key: "execute",   label: "执行",     icon: <IconPlay className="h-3.5 w-3.5" /> },
    { key: "explain",   label: "EXPLAIN", icon: <IconSearch className="h-3.5 w-3.5" /> },
    { key: "format",    label: "格式化",   icon: <IconWand className="h-3.5 w-3.5" /> },
    { key: "translate", label: "方言翻译", icon: <IconLanguages className="h-3.5 w-3.5" /> },
    { key: "validate",  label: "验证",     icon: <IconCheck className="h-3.5 w-3.5" /> },
  ];

  return (
    <div className="flex flex-col gap-4 w-full h-full min-h-0">
      <PanelHeader title="SQL 工作台" desc="多方言 SQL 编辑器，支持执行、格式化、翻译与验证">
        <div className="flex items-center gap-2">
          {dbList.length > 0 && (
            <Fragment>
              <span className="text-[10px] text-neutral-400">数据库:</span>
              <select className="input-light w-auto text-xs py-1.5 px-2" value={database} onChange={e => setDatabase(e.target.value)}>
                {dbList.map(d => <option key={d.db_id} value={d.db_id}>{d.database_name || d.alias || d.db_id} ({d.db_type})</option>)}
              </select>
            </Fragment>
          )}
          <span className="text-[10px] text-neutral-400">源:</span>
          <select className="input-light w-auto text-xs py-1.5 px-2" value={dialect} onChange={e => setDialect(e.target.value)}>
            {["postgres", "mysql", "duckdb", "sqlite", "clickhouse", "snowflake", "bigquery", "starrocks", "redshift", "databricks", "trino"].map(d => <option key={d} value={d}>{d}</option>)}
          </select>
          {activeTab === "translate" && (
            <Fragment>
              <span className="text-[10px] text-neutral-400">→</span>
              <select className="input-light w-auto text-xs py-1.5 px-2" value={targetDialect} onChange={e => setTargetDialect(e.target.value)}>
                {["mysql", "postgres", "sqlite", "duckdb", "clickhouse", "snowflake", "bigquery", "starrocks", "redshift", "databricks", "trino"].map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            </Fragment>
          )}
        </div>
      </PanelHeader>

      {/* Editor */}
      <Card className="p-4 flex-1 flex flex-col min-h-0">
        <div className="flex items-center gap-1 mb-3 flex-wrap">
          {tabs.map(tab => (
            <button key={tab.key}
              className={cn("flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full transition-all border-none cursor-pointer",
                activeTab === tab.key
                  ? "bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 font-medium"
                  : "bg-transparent text-neutral-500 hover:text-neutral-900 dark:hover:text-neutral-100 hover:bg-gray-100 dark:hover:bg-neutral-800")}
              onClick={() => handleTab(tab.key)}>{tab.icon}{tab.label}</button>
          ))}
          <div className="flex-1" />
          {loading && <span className="text-[11px] text-neutral-400 animate-pulse">执行中…</span>}
          <span className="text-[11px] text-neutral-400 font-mono">只读模式 · max_rows=1000</span>
        </div>
        <textarea
          className="input-light font-mono text-sm flex-1 resize-none leading-relaxed"
          style={{ fontFamily: "'JetBrains Mono', monospace" }}
          value={sql}
          onChange={e => setSql(e.target.value)}
          spellCheck={false}
        />
      </Card>

      {/* Output */}
      {output && (
        <Card className="p-4 max-h-[38%] overflow-auto panel-enter">
          <div className="flex items-center justify-between mb-3">
            <span className="text-xs font-medium text-neutral-400 uppercase tracking-wider">
              {output.type === "result" ? "查询结果" : output.type === "explain" ? "执行计划" : output.type === "validate" ? "验证结果" : "输出"}
            </span>
            <div className="flex items-center gap-2">
              {output.elapsed && <span className="text-xs text-neutral-400">{output.elapsed}</span>}
              {output.rowCount != null && <span className="text-xs text-neutral-400">{output.rowCount} 行</span>}
            </div>
          </div>
          {output.type === "result" && (
            <Fragment>
              <ResultTable rows={output.rows} columns={output.columns} />
              {output.rowCount > 100 && <p className="text-xs text-neutral-400 mt-1">Showing first 100 rows (truncated)</p>}
            </Fragment>
          )}
          {output.type === "explain" && (
            <Fragment>
              <pre className="text-xs font-mono text-neutral-700 dark:text-neutral-300 m-0 whitespace-pre-wrap bg-gray-50 dark:bg-neutral-800 rounded-lg p-3" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{output.plan || output.message}</pre>
              {output.details && (
                <div className="mt-3 grid grid-cols-2 gap-2 text-xs">
                  {output.details.tables && <div className="flex items-center gap-1"><span className="text-neutral-400">Tables:</span><span className="font-mono text-neutral-600 dark:text-neutral-300">{output.details.tables.join(", ")}</span></div>}
                  {output.details.joins && <div className="flex items-center gap-1"><span className="text-neutral-400">Joins:</span><span className="font-mono text-neutral-600 dark:text-neutral-300">{output.details.joins.join(", ")}</span></div>}
                  {output.details.hasAggregation && <div className="flex items-center gap-1"><span className="text-neutral-400">Aggregation:</span><span className="text-emerald-600 dark:text-emerald-400">Yes</span></div>}
                  {output.details.hasSubquery && <div className="flex items-center gap-1"><span className="text-neutral-400">Subquery:</span><span className="text-amber-600 dark:text-amber-400">Yes</span></div>}
                  {output.details.hasCTE && <div className="flex items-center gap-1"><span className="text-neutral-400">CTE:</span><span className="text-blue-600 dark:text-blue-400">Yes</span></div>}
                </div>
              )}
            </Fragment>
          )}
          {output.type === "validate" && (
            <div className="space-y-2">
              <div className="flex items-center gap-2">
                <span className={cn("w-2 h-2 rounded-full", output.syntaxOk ? "bg-emerald-500" : "bg-red-400")} />
                <span className="text-sm font-medium text-neutral-700 dark:text-neutral-300">
                  {output.syntaxOk ? "Syntax valid" : "Syntax error"}
                </span>
              </div>
              {output.errors && output.errors.length > 0 && (
                <div className="space-y-1">
                  {output.errors.map((e, i) => (
                    <div key={i} className="flex items-start gap-1.5 text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-500/10 px-2 py-1 rounded">
                      <IconAlert className="h-3 w-3 flex-shrink-0 mt-0.5" /> {e}
                    </div>
                  ))}
                </div>
              )}
              {output.warnings && output.warnings.length > 0 && (
                <div className="space-y-1">
                  {output.warnings.map((w, i) => (
                    <div key={i} className="flex items-start gap-1.5 text-xs text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 px-2 py-1 rounded">
                      <IconAlert className="h-3 w-3 flex-shrink-0 mt-0.5" /> {w}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          {output.type === "error" && (
            <div className="flex items-start gap-2 text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-500/10 p-3 rounded-lg">
              <IconAlert className="h-4 w-4 flex-shrink-0 mt-0.5" />
              <span>{output.message}</span>
            </div>
          )}
          {output.type === "info" && (
            <p className="text-sm text-neutral-700 dark:text-neutral-300 m-0 flex items-center gap-1.5">
              <IconCheck className="h-4 w-4 text-emerald-500" /> {output.message}
            </p>
          )}
        </Card>
      )}
    </div>
  );
};

/* ════════════════════════════════════════════════════════════════════════════
   5. MCP 服务 — fetches from GET /api/v1/mcp/servers
   ════════════════════════════════════════════════════════════════════════════ */
const McpPanel = () => {
  const [servers, setServers] = useState([]);
  const [expandedServer, setExpandedServer] = useState(null);
  const [serverDetails, setServerDetails] = useState({});
  const [loading, setLoading] = useState(true);
  const [healthCheckResults, setHealthCheckResults] = useState({});
  const [healthChecking, setHealthChecking] = useState({});
  const [togglingServer, setTogglingServer] = useState({});
  const notify = useNotify();

  const fetchServers = useCallback(() => {
    setLoading(true);
    api.mcpServers().then(data => {
      if (data.servers && data.servers.length > 0) {
        setServers(data.servers.map(s => ({
          name: s.name || s.id,
          port: s.port || '',
          tools: s.tool_count || 0,
          resources: s.resource_count || 0,
          status: s.status || 'running',
          desc: s.description || '',
          serverType: s.server_type || '',
          transport: s.transport || 'sse',
          host: s.host || 'localhost',
          lastHealthCheck: s.last_health_check || null,
        })));
      } else {
        // Fallback built-in servers
        setServers([
          { name: "db_server", serverType: "database", port: 8081, tools: 4, resources: 2, status: "running", desc: "数据库内省与执行工具", transport: "sse", host: "localhost" },
          { name: "knowledge_server", serverType: "knowledge", port: 8082, tools: 3, resources: 1, status: "running", desc: "领域知识库检索", transport: "sse", host: "localhost" },
          { name: "vector_server", serverType: "vector", port: 8083, tools: 2, resources: 1, status: "running", desc: "向量检索与 RAG", transport: "sse", host: "localhost" },
          { name: "learning_server", serverType: "learning", port: 8084, tools: 2, resources: 0, status: "stopped", desc: "查询历史学习", transport: "sse", host: "localhost" },
        ]);
      }
    }).catch(() => {
      setServers([
        { name: "db_server", serverType: "database", port: 8081, tools: 4, resources: 2, status: "running", desc: "数据库内省与执行工具", transport: "sse", host: "localhost" },
        { name: "knowledge_server", serverType: "knowledge", port: 8082, tools: 3, resources: 1, status: "running", desc: "领域知识库检索", transport: "sse", host: "localhost" },
        { name: "vector_server", serverType: "vector", port: 8083, tools: 2, resources: 1, status: "running", desc: "向量检索与 RAG", transport: "sse", host: "localhost" },
        { name: "learning_server", serverType: "learning", port: 8084, tools: 2, resources: 0, status: "stopped", desc: "查询历史学习", transport: "sse", host: "localhost" },
      ]);
    }).finally(() => setLoading(false));
  }, []);

  useEffect(() => { fetchServers(); }, [fetchServers]);

  const handleToggleServer = async (serverName) => {
    setTogglingServer(prev => ({ ...prev, [serverName]: true }));
    try {
      const currentServer = servers.find(s => s.name === serverName);
      const newStatus = currentServer?.status === "running" ? "stopped" : "running";
      const endpoint = newStatus === "stopped" ? "stop" : "start";
      await api._fetch(`/api/v1/mcp/servers/${encodeURIComponent(serverName)}/${endpoint}`, { method: 'POST' });
      setServers(prev => prev.map(s => {
        if (s.name === serverName) {
          notify(`${s.name} ${newStatus === "running" ? "已启动" : "已停止"}`, 'ok', 2000);
          return { ...s, status: newStatus };
        }
        return s;
      }));
    } catch(e) {
      console.error("Failed to toggle server:", e);
      notify(`切换 ${serverName} 失败: ${e.message}`, 'error', 3000);
    } finally {
      setTogglingServer(prev => ({ ...prev, [serverName]: false }));
    }
  };

  const handleHealthCheck = async (serverName) => {
    setHealthChecking(prev => ({ ...prev, [serverName]: true }));
    try {
      await api._fetch(`/api/v1/mcp/servers/${encodeURIComponent(serverName)}/health`, { method: 'POST' });
      setHealthCheckResults(prev => ({
        ...prev,
        [serverName]: { status: "ok", time: new Date().toLocaleTimeString() }
      }));
      notify(`${serverName} 健康检查通过`, 'ok', 2000);
    } catch(e) {
      setHealthCheckResults(prev => ({
        ...prev,
        [serverName]: { status: "error", error: e.message, time: new Date().toLocaleTimeString() }
      }));
      notify(`${serverName} 健康检查失败: ${e.message}`, 'error', 3000);
    } finally {
      setHealthChecking(prev => ({ ...prev, [serverName]: false }));
    }
  };

  const handleExpandServer = async (serverName) => {
    if (expandedServer === serverName) {
      setExpandedServer(null);
      return;
    }
    setExpandedServer(serverName);
    if (!serverDetails[serverName]) {
      try {
        const data = await api._fetch(`/api/v1/mcp/servers/${encodeURIComponent(serverName)}`);
        setServerDetails(prev => ({ ...prev, [serverName]: data }));
      } catch(e) {
        setServerDetails(prev => ({ ...prev, [serverName]: { tools: [], resources: [] } }));
      }
    }
  };

  const runningCount = servers.filter(s => s.status === "running").length;
  const totalTools = servers.reduce((sum, s) => sum + s.tools, 0);

  return (
    <div className="flex flex-col gap-5 w-full">
      <PanelHeader title="MCP 服务" desc="FastMCP 双角色 — Server 暴露 NL2SQL 工具，Client 消费外部 MCP 工具">
        <div className="flex items-center gap-2">
          <span className="status-badge">
            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-dot" />
            {runningCount}/{servers.length} 运行中
          </span>
          <button className="btn-outline" onClick={fetchServers}>
            <IconRefresh className="h-3.5 w-3.5" />
          </button>
        </div>
      </PanelHeader>

      {/* Stats cards */}
      <div className="grid grid-cols-3 gap-3">
        {[["4", "MCP 服务器"], [String(runningCount), "运行中"], [String(totalTools), "已注册工具"]].map(([v, l]) => (
          <Card key={l} className="p-4 text-center">
            <div className="text-2xl font-semibold text-neutral-900 dark:text-neutral-100">{v}</div>
            <div className="text-xs text-neutral-400 mt-0.5">{l}</div>
          </Card>
        ))}
      </div>

      {loading ? (
        <p className="text-sm text-neutral-400 text-center py-4">加载 MCP 服务列表…</p>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {servers.map(s => {
            const details = serverDetails[s.name];
            const health = healthCheckResults[s.name];
            const isExpanded = expandedServer === s.name;
            return (
              <Card key={s.name} className={cn("p-4 transition-all", isExpanded && "ring-2 ring-neutral-900/10 dark:ring-neutral-100/10")}>
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-3 min-w-0">
                    <span className={cn("w-2 h-2 rounded-full flex-shrink-0", s.status === "running" ? "bg-emerald-500 pulse-dot" : "bg-neutral-300 dark:bg-neutral-600")} />
                    <div className="min-w-0">
                      <span className="text-neutral-900 dark:text-neutral-100 text-sm font-mono font-semibold">{s.name}</span>
                      {s.port && <span className="text-xs text-neutral-400 font-mono ml-1">:{s.port}</span>}
                    </div>
                  </div>
                  <span className={cn("text-xs px-2 py-0.5 rounded-full font-medium flex-shrink-0",
                    s.status === "running"
                      ? "bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400"
                      : "bg-gray-100 text-neutral-400 dark:bg-neutral-800 dark:text-neutral-500")}>
                    {s.status === "running" ? "运行中" : "已停止"}
                  </span>
                </div>
                <p className="text-neutral-500 dark:text-neutral-400 text-xs m-0 mb-1">{s.desc}</p>
                {s.serverType && <span className="text-[10px] text-neutral-400 font-mono bg-gray-50 dark:bg-neutral-800 px-1.5 py-0.5 rounded">{s.serverType}</span>}

                <div className="flex items-center gap-2 text-xs text-neutral-400 mt-3">
                  <span className="bg-gray-50 dark:bg-neutral-800 px-2 py-0.5 rounded">{s.tools} 工具</span>
                  <span className="bg-gray-50 dark:bg-neutral-800 px-2 py-0.5 rounded">{s.resources} 资源</span>
                  <div className="flex-1" />
                  <button className="icon-btn !p-1" onClick={() => handleHealthCheck(s.name)} disabled={healthChecking[s.name]} title="健康检查">
                    {healthChecking[s.name]
                      ? <svg className="animate-spin h-3.5 w-3.5" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                      : <IconZap className="h-3.5 w-3.5" />}
                  </button>
                  <button className="btn-outline !py-0.5 !px-2.5 !text-[11px]"
                    onClick={() => handleToggleServer(s.name)}
                    disabled={togglingServer[s.name]}>
                    {togglingServer[s.name] ? "…" : s.status === "running" ? "停止" : "启动"}
                  </button>
                  <button className="icon-btn !p-1" onClick={() => handleExpandServer(s.name)} title="详情">
                    <IconChevron className={cn("h-3.5 w-3.5 transition-transform", isExpanded && "rotate-90")} />
                  </button>
                </div>

                {/* Health check result */}
                {health && (
                  <div className={cn("mt-2 text-xs px-2 py-1 rounded",
                    health.status === "ok" ? "bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400" : "bg-red-50 dark:bg-red-500/10 text-red-500 dark:text-red-400")}>
                    {health.status === "ok" ? <IconCheck className="h-3 w-3 inline mr-1" /> : <IconAlert className="h-3 w-3 inline mr-1" />}
                    {health.status === "ok" ? `健康检查通过 · ${health.time}` : `健康检查失败 · ${health.time}`}
                  </div>
                )}

                {/* Expanded server details */}
                {isExpanded && details && (
                  <div className="mt-3 pt-3 border-t border-neutral-100 dark:border-neutral-800 space-y-2">
                    {details.tools && details.tools.length > 0 && (
                      <div>
                        <div className="text-[10px] font-medium text-neutral-400 uppercase tracking-wider mb-1.5">已注册工具</div>
                        <div className="space-y-1">
                          {details.tools.map(t => (
                            <div key={t.name} className="flex items-center gap-2 text-xs bg-gray-50 dark:bg-neutral-800 rounded px-2 py-1">
                              <span className="w-1 h-1 rounded-full bg-emerald-500 flex-shrink-0" />
                              <span className="text-neutral-700 dark:text-neutral-300 font-mono">{t.name}</span>
                              <span className="text-neutral-400 truncate">{t.description}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {details.resources && details.resources.length > 0 && (
                      <div>
                        <div className="text-[10px] font-medium text-neutral-400 uppercase tracking-wider mb-1.5">已注册资源</div>
                        <div className="space-y-1">
                          {details.resources.map(r => (
                            <div key={r.uri} className="flex items-center gap-2 text-xs bg-gray-50 dark:bg-neutral-800 rounded px-2 py-1">
                              <span className="w-1 h-1 rounded-full bg-blue-500 flex-shrink-0" />
                              <span className="text-neutral-700 dark:text-neutral-300 font-mono">{r.uri}</span>
                              <span className="text-neutral-400 truncate">{r.description}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {s.lastHealthCheck && (
                      <div className="text-[10px] text-neutral-400">
                        上次健康检查: {new Date(s.lastHealthCheck).toLocaleString()}
                      </div>
                    )}
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}

      {/* Client role — connected external MCP tools */}
      <Card className="p-4">
        <h3 className="text-sm font-semibold text-neutral-900 dark:text-neutral-100 m-0 mb-3">Client 角色 — 已连接外部 MCP 工具</h3>
        <div className="flex gap-2 flex-wrap">
          {[
            { label: "数据库内省", icon: "🔌", tool: "list_tables, describe_table, query, explain" },
            { label: "知识检索", icon: "📚", tool: "search_terms, match_rules" },
            { label: "向量搜索", icon: "🔍", tool: "hybrid_search, knn_search" },
            { label: "指标查询", icon: "📊", tool: "resolve_metric, query_metric" },
            { label: "反馈学习", icon: "🧠", tool: "record_feedback, extract_rule" },
          ].map(t => (
            <span key={t.label} className="text-xs text-neutral-500 dark:text-neutral-400 bg-gray-50 dark:bg-neutral-800 px-2 py-1.5 rounded-lg cursor-default" title={t.tool}>
              {t.icon} {t.label}
            </span>
          ))}
        </div>
      </Card>

      {/* Transport endpoints */}
      <Card className="p-4">
        <h3 className="text-sm font-semibold text-neutral-900 dark:text-neutral-100 m-0 mb-3">传输层端点</h3>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
          {servers.filter(s => s.status === "running").map(s => (
            <div key={s.name} className="flex items-center justify-between p-2.5 rounded-lg bg-gray-50 dark:bg-neutral-800">
              <span className="text-neutral-600 dark:text-neutral-300 font-medium font-mono">{s.name}</span>
              <span className="text-neutral-400 font-mono text-[11px]">
                {s.transport === "sse" ? `http://${s.host}:${s.port}/sse` : `python -m app.mcp.${s.name}`}
              </span>
            </div>
          ))}
          {servers.filter(s => s.status === "running").length === 0 && (
            <div className="col-span-2 text-center text-neutral-400 text-xs py-2">暂无运行中的服务</div>
          )}
        </div>
      </Card>
    </div>
  );
};

/* ════════════════════════════════════════════════════════════════════════════
   6. 工作流 — fetches from GET /api/v1/workflows & /api/v1/workflows/stats
   ════════════════════════════════════════════════════════════════════════════ */
const WorkflowPanel = () => {
  const [plans, setPlans] = useState([]);
  const [traces, setTraces] = useState([]);
  const [stats, setStats] = useState(null);
  const [selectedPlan, setSelectedPlan] = useState(null);
  const [loading, setLoading] = useState(true);

  const fetchData = useCallback(() => {
    setLoading(true);
    Promise.all([
      api.workflows(),
      api.workflowTraces(20),
      api.workflowStats(),
    ]).then(([wfData, traceData, statsData]) => {
      if (wfData.plans && wfData.plans.length > 0) {
        setPlans(wfData.plans.map(p => ({
          id: p.id,
          name: p.name,
          nodes: p.node_count || 0,
          nodeList: p.nodes || [],
          desc: p.description || '',
          category: p.category || '',
        })));
      } else {
        setPlans([]);
      }
      if (traceData.traces && traceData.traces.length > 0) {
        setTraces(traceData.traces.map(t => ({
          id: t.id || t.trace_id,
          plan: t.plan || t.plan_id || '',
          status: t.status || 'success',
          duration: t.duration || t.elapsed || '',
          time: t.time || t.created_at || '',
          nodes: t.nodes || [],
        })));
      } else {
        setTraces([]);
      }
      if (statsData && statsData.total_executions !== undefined) {
        setStats(statsData);
      } else {
        setStats({ total_executions: 0, success_rate: 0, avg_duration_ms: 0 });
      }
    }).catch(() => {
      setPlans([]);
      setTraces([]);
      setStats({ total_executions: 0, success_rate: 0, avg_duration_ms: 0 });
    }).finally(() => setLoading(false));
  }, []);

  useEffect(() => { fetchData(); }, [fetchData]);

  const activePlan = selectedPlan ? plans.find(p => p.id === selectedPlan) : plans[0];
  const nodeList = activePlan?.nodeList || [];
  const categories = [...new Set(plans.map(p => p.category).filter(Boolean))];

  return (
    <div className="flex flex-col gap-5 w-full">
      <PanelHeader title="工作流" desc="Harness 驱动的确定性节点流水线 — 由工作流定义而非 LLM 决策">
        <div className="flex items-center gap-2">
          <span className="status-badge font-mono text-[10px]">{plans.length} 个计划</span>
          <button className="btn-outline" onClick={fetchData}>
            <IconRefresh className="h-3.5 w-3.5" />
          </button>
        </div>
      </PanelHeader>

      {/* Stats */}
      {stats && (
        <div className="grid grid-cols-3 gap-3">
          {[["总执行次数", stats.total_executions || 0], ["成功率", (stats.success_rate || 0) + "%"], ["平均耗时", (stats.avg_duration_ms || 0) + "ms"]].map(([l, v]) => (
            <Card key={l} className="p-4 text-center">
              <div className="text-2xl font-semibold text-neutral-900 dark:text-neutral-100">{v}</div>
              <div className="text-xs text-neutral-400 mt-0.5">{l}</div>
            </Card>
          ))}
        </div>
      )}

      {/* Plan cards */}
      <div className="flex gap-2 flex-wrap">
        {categories.map(cat => (
          <button key={cat} className={cn("btn-outline text-xs", selectedPlan && plans.find(p => p.id === selectedPlan)?.category === cat && "active")}
            onClick={() => { const p = plans.find(p => p.category === cat); if (p) setSelectedPlan(p.id); }}>
            {cat}
          </button>
        ))}
      </div>

      {loading ? (
        <p className="text-sm text-neutral-400 text-center py-4">加载工作流数据…</p>
      ) : plans.length === 0 ? (
        <p className="text-sm text-neutral-400 text-center py-4">暂无工作流计划，请先执行查询</p>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {plans.map(p => (
            <Card key={p.id}
              className={cn("p-4 cursor-pointer hover:shadow-md transition-all", selectedPlan === p.id && "ring-2 ring-neutral-900/10 dark:ring-neutral-100/10")}
              onClick={() => setSelectedPlan(selectedPlan === p.id ? null : p.id)}>
              <div className="flex items-center justify-between mb-2">
                <span className="text-neutral-900 dark:text-neutral-100 text-sm font-semibold">{p.name}</span>
                <span className="text-xs text-neutral-400 font-mono">{p.id}</span>
              </div>
              <p className="text-neutral-500 dark:text-neutral-400 text-xs m-0 mb-2">{p.desc}</p>
              <div className="flex items-center gap-2">
                <span className="text-xs text-neutral-400 font-medium">{p.nodes} 节点 · YAML 声明式</span>
                <span className="text-[10px] text-neutral-400 font-mono bg-gray-50 dark:bg-neutral-800 px-1.5 py-0.5 rounded">{p.category}</span>
              </div>
            </Card>
          ))}
        </div>
      )}

      {/* Pipeline visualization */}
      {activePlan && nodeList.length > 0 && (
        <Card className="p-5">
          <h3 className="text-xs font-medium text-neutral-400 uppercase tracking-wider m-0 mb-4 text-center">
            节点执行顺序 — {activePlan.id}
          </h3>
          <div className="flex items-center gap-0 overflow-x-auto">
            {nodeList.map((n, i) => (
              <Fragment key={n.name || i}>
                <div className="flex flex-col items-center flex-1 min-w-[80px]">
                  <div className="w-10 h-10 rounded-xl bg-gray-100 dark:bg-neutral-800 flex items-center justify-center text-lg mb-1.5">{n.icon || "⚙️"}</div>
                  <span className="text-xs font-medium text-neutral-700 dark:text-neutral-300 whitespace-nowrap">{n.label || n.name}</span>
                  <span className="text-[10px] text-neutral-400 font-mono whitespace-nowrap">{n.name}</span>

                {i < nodeList.length - 1 && (
                  <div className="flex-shrink-0 w-6 h-px bg-neutral-200 dark:bg-neutral-700 relative -top-3">

              </Fragment>
            ))}

      {/* Recent traces */}
      <Card className="p-4">
        <h3 className="text-xs font-medium text-neutral-400 uppercase tracking-wider m-0 mb-3">
          最近执行追踪
          <span className="ml-2 text-[10px] font-normal">{traces.length} 条</span>
        </h3>
        {traces.length === 0 ? (
          <p className="text-sm text-neutral-400 text-center py-4">暂无执行记录</p>
        ) : (
          <div className="overflow-auto">
            <table className="table-light">
              <thead><tr><th>Trace ID</th><th>计划</th><th>状态</th><th>耗时</th><th>时间</th></tr></thead>
              <tbody>
                {traces.map(t => (
                  <tr key={t.id} className="cursor-pointer hover:bg-gray-50 dark:hover:bg-neutral-800/50">
                    <td className="font-mono text-xs">{t.id}</td>
                    <td className="font-mono text-xs">{t.plan}</td>
                    <td>
                      <span className={cn("text-xs px-2 py-0.5 rounded-full font-medium",
                        t.status === "success"
                          ? "bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400"
                          : "bg-red-50 text-red-500 dark:bg-red-500/10 dark:text-red-400")}>
                        {t.status === "success" ? "成功" : "失败"}
                      </span>
                    </td>
                    <td className="text-xs">{t.duration}</td>
                    <td className="text-xs text-neutral-400">{t.time}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
};

  const [activeTab, setActiveTab] = useState("stats");

  const [quality, setQuality] = useState(null);
  const [candidates, setCandidates] = useState([]);
  const [loading, setLoading] = useState(true);

  const fetchData = useCallback(() => {
    setLoading(true);
    Promise.all([
      api.learningStats(),
      api.learningQuality(30),
      api.learningRuleCandidates("pending_review"),
    ]).then(([s, q, c]) => {
      setStats(s);
      setQuality(q);
      setCandidates(c.candidates || []);
    }).catch(() => {}).finally(() => setLoading(false));
  }, []);

  useEffect(() => { fetchData(); }, [fetchData]);

  const handleReview = async (ruleId, action) => {
    setReviewing(r => ({ ...r, [ruleId]: true }));
    try {
      const res = await api.learningReviewRule(ruleId, action);
      if (res && res.status === "ok") {
        setCandidates(prev => prev.filter(c => c.id !== ruleId));
        // Re-fetch stats so counts (pending/approved) update immediately
        api.learningStats().then(s => setStats(s)).catch(() => {});
      } else {
        console.error("Review rejected by server:", res);
        alert(`审核操作失败: ${res?.message || "未知错误"}`);
      }
    } catch(e) {
      console.error("Review failed:", e);
    } finally {
      setReviewing(r => ({ ...r, [ruleId]: false }));
    }
  };

  const tabs = [
    { key: "stats", label: "学习统计", icon: <IconSparkles className="h-3.5 w-3.5" /> },
    { key: "rules", label: "规则候选", icon: <IconCheck className="h-3.5 w-3.5" /> },
    { key: "quality", label: "质量趋势", icon: <IconWand className="h-3.5 w-3.5" /> },

  return (
    <div className="flex flex-col gap-5 w-full">

        <div className="flex items-center gap-2">
          <button className="btn-outline" onClick={fetchData}>

          </button>
        </div>
      </PanelHeader>

      <div className="flex gap-1 border-b border-neutral-200 dark:border-neutral-700">
        {tabs.map(t => (
          <button key={t.key}

              activeTab === t.key ? "text-neutral-900 dark:text-neutral-100 font-medium border-b-2 border-neutral-900 dark:border-neutral-100"
                       : "text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-300")}

        ))}
      </div>

      {loading ? (
        <p className="text-sm text-neutral-400 text-center py-4">加载学习数据…</p>
      ) : (
        <Fragment>
          {activeTab === "stats" && stats && (
            <Fragment>
              <div className="grid grid-cols-3 gap-3">
                {[

                  [String(stats.total_feedback || 0), "反馈记录"],

                  <Card key={l} className="p-4 text-center">
                    <div className="text-2xl font-semibold text-neutral-900 dark:text-neutral-100">{v}</div>
                    <div className="text-xs text-neutral-400 mt-0.5">{l}</div>
                  </Card>
                ))}
              </div>
              <div className="grid grid-cols-3 gap-3">
                {[
                  [String(stats.rule_candidates_count || 0), "规则候选"],
                  [String(stats.pending_review_count || 0), "待审核"],
                  [String(stats.approved_rules_count || 0), "已通过"],

                ))}
              </div>
              <Card className="p-4">
                <h3 className="text-sm font-semibold text-neutral-900 dark:text-neutral-100 m-0 mb-2">学习流水线</h3>
                <div className="flex items-center gap-0 overflow-x-auto py-2">
                  {["反馈收集", "样本对提取", "模式挖掘", "规则候选", "人工审核", "规则已通过"].map((s, i) => (
                    <Fragment key={s}>

                      {i < 5 && <div className="flex-shrink-0 w-4 h-px bg-neutral-200 dark:bg-neutral-700 relative -top-2" />}

                    </div>
                    <p className="text-neutral-900 dark:text-neutral-100 text-sm font-medium m-0 mb-1">{c.description}</p>
                    <div className="flex items-center gap-2 text-xs text-neutral-400 mb-2">
                      <span className="font-mono bg-gray-50 dark:bg-neutral-800 px-1.5 py-0.5 rounded">模式: {c.pattern}</span>
                      <span>置信度: {(c.confidence * 100).toFixed(0)}%</span>
                      <span>来源数: {c.source_count}</span>
                    </div>
                    <div className="bg-gray-50 dark:bg-neutral-800 rounded p-2 text-xs font-mono text-neutral-600 dark:text-neutral-400 mb-3">
                      {c.sql_template}
