                    <div className="flex gap-2">
                      <button className="btn-dark !py-1.5 !px-3.5 !text-xs" onClick={() => handleReview(c.id, "approve")} disabled={reviewing[c.id]}>
                        <IconCheck className="h-3 w-3 inline mr-1" /> 通过
                      </button>
                      <button className="btn-outline !py-1.5 !px-3.5 !text-xs" onClick={() => handleReview(c.id, "reject")} disabled={reviewing[c.id]}>
                        <IconTrash className="h-3 w-3 inline mr-1" /> 拒绝
                      </button>
                    </div>
                  </Card>
                ))
              )}
            </div>
          )}

          {activeTab === "quality" && quality && quality.trends && quality.trends.length > 0 && (
            <Card className="p-4">
              <h3 className="text-sm font-semibold text-neutral-900 dark:text-neutral-100 m-0 mb-3">
                质量趋势 (30天)
                <span className="ml-2 text-xs font-normal text-neutral-400">
                  准确率: {(quality.summary?.current_accuracy * 100).toFixed(1)}%
                </span>
              </h3>
              <div className="overflow-auto">
                <table className="table-light">
                  <thead><tr><th>日期</th><th>准确率</th><th>查询数</th><th>平均响应</th><th>反馈数</th></tr></thead>
                  <tbody>
                    {quality.trends.slice(-14).map(t => (
                      <tr key={t.date}>
                        <td className="font-mono text-xs">{t.date}</td>
                        <td>
                          <div className="flex items-center gap-2">
                            <div className="w-16 h-1.5 rounded-full bg-gray-100 dark:bg-neutral-700 overflow-hidden">
                              <div className="h-full rounded-full bg-emerald-500" style={{width: (t.accuracy * 100) + "%"}} />
                            </div>
                            <span className="text-xs">{(t.accuracy * 100).toFixed(1)}%</span>
                          </div>
                        </td>
                        <td className="text-xs">{t.query_count}</td>
                        <td className="text-xs">{t.avg_response_ms}ms</td>
                        <td className="text-xs">{t.feedback_count}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          )}
          {activeTab === "quality" && (!quality || !quality.trends || quality.trends.length === 0) && (
            <div className="text-center py-8">
              <IconWand className="h-8 w-8 text-neutral-300 dark:text-neutral-600 mx-auto mb-2" />
              <p className="text-sm text-neutral-400 m-0">暂无质量趋势数据</p>
              <p className="text-xs text-neutral-400 mt-1 m-0">提交查询后，系统将自动收集反馈并生成质量趋势</p>
            </div>
          )}
        </Fragment>
      )}
    </div>
  );
};

/* ════════════════════════════════════════════════════════════════════════════
   8. 系统设置 — connects to settings API, health check
   ════════════════════════════════════════════════════════════════════════════ */
const BUILTIN_PROVIDERS = ["openai", "anthropic", "deepseek", "google"];

const SettingsPanel = ({ userName, onLogout }) => {
  const [health, setHealth] = useState(null);
  const [llmSettings, setLlmSettings] = useState(null);
  const [harnessSettings, setHarnessSettings] = useState(null);
  const [databaseSettings, setDatabaseSettings] = useState(null);
  const [ragSettings, setRagSettings] = useState(null);
  const [availableModels, setAvailableModels] = useState([]);
  const [activeTab, setActiveTab] = useState("llm");
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState({});
  const [saveMsg, setSaveMsg] = useState(null);
  const [showNewProvider, setShowNewProvider] = useState(false);
  const [newProvider, setNewProvider] = useState({ name: "", api_key: "", models: "", base_url: "" });
  const [providerKeys, setProviderKeys] = useState({}); // provider -> new API key input (never loaded from server)
  const [togglingProvider, setTogglingProvider] = useState({});
  // RAG management state
  const [ragStats, setRagStats] = useState(null);
  const [rebuilding, setRebuilding] = useState(false);
  const [clearing, setClearing] = useState(false);
  const [ragMsg, setRagMsg] = useState(null);
  const [uploadingDoc, setUploadingDoc] = useState(false);
  const [uploadTitle, setUploadTitle] = useState("");
  const [uploadType, setUploadType] = useState("user_guide");
  const [uploadContent, setUploadContent] = useState("");
  const [uploadMsg, setUploadMsg] = useState(null);

  const fetchSettings = useCallback(() => {
    setLoading(true);
    Promise.all([
      api.health(),
      api._fetch('/api/v1/settings/llm').catch(() => null),
      api._fetch('/api/v1/settings/harness').catch(() => null),
      api._fetch('/api/v1/settings/database').catch(() => null),
      api._fetch('/api/v1/settings/available-models').catch(() => null),
      api.ragSettings().catch(() => null),
    ]).then(([h, llm, harness, db, models, rag]) => {
      setHealth(h);
      setLlmSettings(llm);
      setHarnessSettings(harness);
      setDatabaseSettings(db);
      setRagSettings(rag);
      if (models && models.models) setAvailableModels(models.models);
    }).catch(() => {}).finally(() => setLoading(false));
  }, []);

  useEffect(() => { fetchSettings(); }, [fetchSettings]);

  const handleSaveLLM = async () => {
    setSaving(s => ({ ...s, llm: true }));
    try {
      // Send newly-entered API keys (backend keeps existing keys when empty)
      const providers = {};
      Object.keys(providerKeys).forEach(name => {
        const k = (providerKeys[name] || "").trim();
        if (k) providers[name] = { api_key: k };
      });
      // Preserve base_url edits for custom providers
      Object.keys(llmSettings?.providers || {}).forEach(name => {
        if (BUILTIN_PROVIDERS.includes(name)) return;
        const cfg = llmSettings.providers[name];
        providers[name] = { ...(providers[name] || {}), base_url: (cfg.base_url || "").trim() };
      });
      const payload = {
        default_model: llmSettings?.default_model,
        fallback_model: llmSettings?.fallback_model,
        routing_strategy: llmSettings?.routing_strategy,
        temperature: llmSettings?.temperature,
        max_tokens: llmSettings?.max_tokens,
      };
      if (Object.keys(providers).length > 0) payload.providers = providers;
      const resp = await api._fetch('/api/v1/settings/llm', {
        method: 'PUT',
        headers: api._headers(true),
        body: JSON.stringify(payload),
      });
      setProviderKeys({});
      setSaveMsg({ type: "ok", text: `LLM 配置已保存 · 当前模型: ${resp.active_model || llmSettings?.default_model}${resp.mock_mode ? "（mock 模式）" : ""}` });
      setTimeout(() => setSaveMsg(null), 3000);
      fetchSettings();
    } catch(e) {
      setSaveMsg({ type: "err", text: `保存失败: ${e.message}` });
    } finally { setSaving(s => ({ ...s, llm: false })); }
  };

  const handleProviderToggle = async (providerName) => {
    setTogglingProvider(p => ({ ...p, [providerName]: true }));
    const providers = { ...llmSettings?.providers };
    if (providers[providerName]) {
      providers[providerName] = { ...providers[providerName], enabled: !providers[providerName].enabled };
    }
    try {
      await api._fetch('/api/v1/settings/llm', {
        method: 'PUT',
        headers: api._headers(true),
        body: JSON.stringify({ providers }),
      });
      setLlmSettings(s => s ? { ...s, providers } : s);
      setSaveMsg({ type: "ok", text: `${providerName} 已${providers[providerName]?.enabled ? '启用' : '禁用'}` });
      setTimeout(() => setSaveMsg(null), 2000);
    } catch(e) {
      setSaveMsg({ type: "err", text: `切换失败: ${e.message}` });
    } finally { setTogglingProvider(p => ({ ...p, [providerName]: false })); }
  };

  const handleAddProvider = async () => {
    if (!newProvider.name.trim()) { setSaveMsg({ type: "err", text: "请输入提供商名称" }); return; }
    const providers = { ...llmSettings?.providers };
    const name = newProvider.name.trim().toLowerCase();
    if (providers[name]) { setSaveMsg({ type: "err", text: "该提供商已存在" }); return; }
    providers[name] = {
      enabled: true,
      models: newProvider.models.split(/[,，]/).map(m => m.trim()).filter(Boolean),
      api_key_configured: !!newProvider.api_key.trim(),
      api_key: newProvider.api_key,
      base_url: newProvider.base_url.trim() || null,
    };
    try {
      await api._fetch('/api/v1/settings/llm', {
        method: 'PUT',
        headers: api._headers(true),
        body: JSON.stringify({ providers }),
      });
      setLlmSettings(s => s ? { ...s, providers } : s);
      setSaveMsg({ type: "ok", text: `已添加提供商 ${name}` });
      setTimeout(() => setSaveMsg(null), 3000);
      setShowNewProvider(false);
      setNewProvider({ name: "", api_key: "", models: "", base_url: "" });
      fetchSettings();
    } catch(e) {
      setSaveMsg({ type: "err", text: `添加失败: ${e.message}` });
    }
  };

  const handleDeleteProvider = async (providerName) => {
    if (!confirm(`确定要删除提供商 "${providerName}" 吗？`)) return;
    try {
      await api.deleteProvider(providerName);
      setLlmSettings(s => s ? { ...s, providers: { ...s.providers, [providerName]: undefined } } : s);
      // Remove from providers object
      setLlmSettings(s => {
        if (!s) return s;
        const newProviders = { ...s.providers };
        delete newProviders[providerName];
        return { ...s, providers: newProviders };
      });
      setSaveMsg({ type: "ok", text: `已删除提供商 ${providerName}` });
      setTimeout(() => setSaveMsg(null), 2000);
    } catch(e) {
      setSaveMsg({ type: "err", text: `删除失败: ${e.message}` });
    }
  };

  const handleSaveHarness = async () => {
    setSaving(s => ({ ...s, harness: true }));
    try {
      await api._fetch('/api/v1/settings/harness', {
        method: 'PUT',
        headers: api._headers(true),
        body: JSON.stringify(harnessSettings),
      });
      setSaveMsg({ type: "ok", text: "Harness 约束已保存" });
      setTimeout(() => setSaveMsg(null), 2000);
    } catch(e) {
      setSaveMsg({ type: "err", text: `保存失败: ${e.message}` });
    } finally { setSaving(s => ({ ...s, harness: false })); }
  };

  const handleSaveRag = async () => {
    setSaving(s => ({ ...s, rag: true }));
    try {
      await api.updateRagSettings({
        bm25_weight: ragSettings?.bm25_weight,
        vector_weight: ragSettings?.vector_weight,
        top_k: ragSettings?.top_k,
        similarity_threshold: ragSettings?.similarity_threshold,
        embedding_model: ragSettings?.embedding_model,
      });
      setSaveMsg({ type: "ok", text: "RAG 配置已保存" });
      setTimeout(() => setSaveMsg(null), 2000);
    } catch(e) {
      setSaveMsg({ type: "err", text: `保存失败: ${e.message}` });
    } finally { setSaving(s => ({ ...s, rag: false })); }
  };

  // RAG index management handlers
  const fetchRagStats = useCallback(() => {
    api._fetch('/api/v1/learning/rag/stats').then(r => setRagStats(r)).catch(() => {});
  }, []);

  useEffect(() => { if (activeTab === 'rag') fetchRagStats(); }, [activeTab, fetchRagStats]);

  const handleRebuildSchemaIndex = async () => {
    setRebuilding(true);
    setRagMsg(null);
    try {
      const allConns = await api.databases().catch(() => ({ databases: [] }));
      const dbIds = (allConns.databases || []).map(d => d.db_id).filter(Boolean);
      if (dbIds.length === 0) {
        setRagMsg({ type: "err", text: "没有已连接的数据库。请先在“数据库连接”面板连接数据库，然后再重建 Schema 索引。如需清理旧的脏数据，请使用“清空 RAG 索引”按钮。" });
        setRebuilding(false);
        return;
      }
      setRagMsg({ type: "info", text: `正在从 ${dbIds.length} 个数据库重新提取 Schema...` });
      const results = await Promise.allSettled(dbIds.map(dbId =>
        api.schemaRefresh(dbId)
      ));
      const successCount = results.filter(r => r.status === 'fulfilled').length;
      const failCount = dbIds.length - successCount;
      const details = results.map((r, i) => {
        const dbName = allConns.databases[i]?.database_name || dbIds[i];
        if (r.status === 'fulfilled') {
          const tables = r.value?.table_count || 0;
          return `${dbName}: ${tables} 表`;
        }
        return `${dbName}: 失败`;
      });
      if (failCount === 0) {
        setRagMsg({ type: "ok", text: `Schema 索引重建完成 (${successCount}/${dbIds.length}): ${details.join(', ')}` });
      } else {
        setRagMsg({ type: "err", text: `Schema 索引重建: ${successCount} 成功, ${failCount} 失败: ${details.join(', ')}` });
      }
      fetchRagStats();
    } catch(e) {
      setRagMsg({ type: "err", text: `重建失败: ${e.message}` });
    } finally { setRebuilding(false); }
  };

  const handleRefreshRAG = async () => {
    setRagMsg(null);
    try {
      const allConns = await api.databases().catch(() => ({ databases: [] }));
      const dbIds = (allConns.databases || []).map(d => d.db_id).filter(Boolean);
      if (dbIds.length === 0) {
        setRagMsg({ type: "err", text: "没有已连接的数据库。RAG 索引刷新需要活跃的数据库连接。如需清理旧的脏数据，请使用“清空 RAG 索引”按钮。" });
        return;
      }
      setRagMsg({ type: "info", text: `正在刷新 ${dbIds.length} 个数据库的 RAG 索引...` });
      const results = await Promise.allSettled(dbIds.map(dbId =>
        api._fetch(`/api/v1/learning/rag/refresh?db_id=${encodeURIComponent(dbId)}`, { method: 'POST' })
      ));
      const successCount = results.filter(r => r.status === 'fulfilled').length;
      const failCount = dbIds.length - successCount;
      const details = results.map((r, i) => {
        const dbName = allConns.databases[i]?.database_name || dbIds[i];
        if (r.status === 'fulfilled') {
          return r.value?.refreshed ? `${dbName}: 成功` : `${dbName}: 无变更`;
        }
        return `${dbName}: 失败`;
      });
      if (failCount === 0) {
        setRagMsg({ type: "ok", text: `RAG 索引刷新完成 (${successCount}/${dbIds.length}): ${details.join(', ')}` });
      } else {
        setRagMsg({ type: "err", text: `RAG 索引刷新: ${successCount} 成功, ${failCount} 失败: ${details.join(', ')}` });
      }
      fetchRagStats();
    } catch(e) {
      setRagMsg({ type: "err", text: `刷新失败: ${e.message}` });
    }
  };

  const handleClearRAG = async () => {
    // Confirm before destructive action
    const schemaCount = ragStats?.schema?.lancedb_count || 0;
    const metricsCount = ragStats?.metrics?.lancedb_count || 0;
    const docsCount = ragStats?.documents?.lancedb_count || 0;
    const total = schemaCount + metricsCount + docsCount;
    if (total === 0) {
      setRagMsg({ type: "info", text: "RAG 索引为空，无需清空。" });
      return;
    }
    if (!window.confirm(
      `确定要清空所有 RAG 索引吗？\n\n` +
      `当前索引数量：\n` +
      `  • Schema: ${schemaCount} 条\n` +
      `  • Metrics: ${metricsCount} 条\n` +
      `  • Documents: ${docsCount} 条\n\n` +
      `此操作会删除所有已索引的 schema/指标/文档数据（包括 LanceDB 与 BM25 后端），\n` +
      `用于清理已断开连接的旧数据库遗留的脏数据。\n\n` +
      `操作后，仍已连接的数据库可在下次刷新或重建时重新索引；\n` +
      `但已上传的文档需要重新上传。`
    )) {
      return;
    }
    setClearing(true);
    setRagMsg({ type: "info", text: "正在清空所有 RAG 索引..." });
    try {
      const r = await api._fetch('/api/v1/learning/rag/clear', {
        method: 'POST',
        headers: api._headers(true),
        body: JSON.stringify({ scope: 'all' }),
      });
      if (r?.status === 'ok') {
        const c = r.cleared || {};
        const parts: string[] = [];
        if (c.schema) parts.push(`Schema: ${c.schema.before_lancedb} → ${c.schema.after_lancedb}`);
        if (c.metrics) parts.push(`Metrics: ${c.metrics.before_lancedb} → ${c.metrics.after_lancedb}`);
        if (c.documents) parts.push(`Documents: ${c.documents.before_lancedb} → ${c.documents.after_lancedb}`);
        setRagMsg({ type: "ok", text: `RAG 索引已清空 (${parts.join(', ')})` });
      } else {
        setRagMsg({ type: "err", text: `清空失败: ${r?.message || '未知错误'}` });
      }
      fetchRagStats();
    } catch(e) {
      setRagMsg({ type: "err", text: `清空失败: ${e.message}` });
    } finally {
      setClearing(false);
    }
  };

/* ════════════════════════════════════════════════════════════════════════════
   7b. 用户设置 — 修改密码、上传头像、注销账号
   ════════════════════════════════════════════════════════════════════════════ */
const UserSettingsPanel = ({ userName, userAvatar, onLogout, onUserUpdate }) => {
  const [activeSection, setActiveSection] = useState("avatar");
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState(null);
  const [previewAvatar, setPreviewAvatar] = useState(userAvatar || "");

  // ── Password change state ──
  const [oldPwd, setOldPwd] = useState("");
  const [newPwd, setNewPwd] = useState("");
  const [confirmPwd, setConfirmPwd] = useState("");

  // ── Delete account state ──
  const [deletePwd, setDeletePwd] = useState("");
  const [deleteConfirm, setDeleteConfirm] = useState(false);

  const showMsg = (text, isError = false) => {
    setMsg({ text, isError });
    setTimeout(() => setMsg(null), 4000);
  };

  const handleChangePassword = async () => {
    if (!oldPwd) { showMsg("请输入当前密码", true); return; }
    if (newPwd.length < 6) { showMsg("新密码至少 6 个字符", true); return; }
    if (newPwd !== confirmPwd) { showMsg("两次输入的新密码不一致", true); return; }
    setLoading(true);
    try {
      await api.changePassword(oldPwd, newPwd);
      showMsg("密码修改成功");
      setOldPwd(""); setNewPwd(""); setConfirmPwd("");
    } catch (e) {
      showMsg(e.message || "密码修改失败", true);
    } finally { setLoading(false); }
  };

  const handleAvatarUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) { showMsg("请选择图片文件", true); return; }
    if (file.size > 5 * 1024 * 1024) { showMsg("图片大小不能超过 5MB", true); return; }
    setLoading(true);
    try {
      const result = await api.uploadAvatar(file);
      const avatarUrl = result.avatar_url;
      // Build full URL for avatar
      const fullUrl = avatarUrl.startsWith("http") ? avatarUrl : `${API_BASE}${avatarUrl}`;
      setPreviewAvatar(fullUrl);
      // Update localStorage user
      try {
        const u = JSON.parse(localStorage.getItem("nl2sql_user") || "{}");
        u.avatar_url = avatarUrl;
        localStorage.setItem("nl2sql_user", JSON.stringify(u));
      } catch (_) {}
      if (onUserUpdate) onUserUpdate({ avatar_url: avatarUrl });
      showMsg("头像更新成功");
    } catch (e) {
      showMsg(e.message || "头像上传失败", true);
    } finally { setLoading(false); }
  };

  const handleDeleteAccount = async () => {
    if (!deletePwd) { showMsg("请输入密码确认", true); return; }
    if (!deleteConfirm) { showMsg("请勾选确认删除", true); return; }
    setLoading(true);
    try {
      await api.deleteAccount(deletePwd);
      showMsg("账号已注销，即将跳转...");
      setTimeout(() => onLogout(), 1500);
    } catch (e) {
      showMsg(e.message || "账号注销失败", true);
    } finally { setLoading(false); }
  };

  const sections = [
    { key: "avatar", label: "更换头像", icon: <IconUser className="h-4 w-4" /> },
    { key: "password", label: "修改密码", icon: <IconLock className="h-4 w-4" /> },
    { key: "danger", label: "账号注销", icon: <IconAlert className="h-4 w-4" /> },
  ];

  return (
    <div className="flex flex-col h-full overflow-auto">
      {/* Header */}
      <div className="flex items-center gap-3 mb-6 px-1">
        <div className="p-2 rounded-lg bg-violet-100 dark:bg-violet-900/30">
          <IconUser className="h-5 w-5 text-violet-600 dark:text-violet-400" />
        </div>
        <div>
          <h2 className="text-lg font-semibold text-neutral-900 dark:text-neutral-100 m-0">用户设置</h2>
          <p className="text-xs text-neutral-500 dark:text-neutral-400 m-0">{userName}</p>
        </div>
      </div>

      {/* Message toast */}
      {msg && (
        <div className={`mb-4 px-3 py-2 rounded-lg text-sm font-medium ${
          msg.isError ? "bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400" :
          "bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400"
        }`}>
          {msg.text}
        </div>
      )}

      {/* Section tabs */}
      <div className="flex gap-1 mb-5 bg-neutral-100 dark:bg-neutral-800 rounded-lg p-1">
        {sections.map(s => (
          <button
            key={s.key}
            onClick={() => setActiveSection(s.key)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition-colors flex-1 ${
              activeSection === s.key
                ? "bg-white dark:bg-neutral-700 text-neutral-900 dark:text-neutral-100 shadow-sm"
                : "text-neutral-500 dark:text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-300"
            }`}
          >
            {s.icon}
            {s.label}
          </button>
        ))}
      </div>

      {/* Avatar section */}
      {activeSection === "avatar" && (
        <div className="flex flex-col items-center gap-4">
          <div className="relative group">
            <img
              src={previewAvatar || "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=120&h=120&fit=crop&crop=face"}
              className="h-24 w-24 rounded-full object-cover ring-2 ring-neutral-200 dark:ring-neutral-700"
              alt="头像"
            />
            <label className="absolute inset-0 flex items-center justify-center rounded-full bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
              <span className="text-white text-xs font-medium">更换</span>
              <input type="file" accept="image/*" className="hidden" onChange={handleAvatarUpload} />
            </label>
          </div>
          <p className="text-xs text-neutral-500 dark:text-neutral-400">点击头像上传新图片（支持 JPG、PNG、GIF、WebP，最大 5MB）</p>
        </div>
      )}

      {/* Password section */}
      {activeSection === "password" && (
        <div className="flex flex-col gap-4 max-w-sm">
          <div>
            <label className="text-xs font-medium text-neutral-500 dark:text-neutral-400 block mb-1.5">当前密码</label>
            <input
              type="password" className="input-light w-full" value={oldPwd}
              onChange={e => setOldPwd(e.target.value)} placeholder="输入当前密码"
            />
          </div>
          <div>
            <label className="text-xs font-medium text-neutral-500 dark:text-neutral-400 block mb-1.5">新密码</label>
            <input
              type="password" className="input-light w-full" value={newPwd}
              onChange={e => setNewPwd(e.target.value)} placeholder="至少 6 个字符"
            />
          </div>
          <div>
            <label className="text-xs font-medium text-neutral-500 dark:text-neutral-400 block mb-1.5">确认新密码</label>
            <input
              type="password" className="input-light w-full" value={confirmPwd}
              onChange={e => setConfirmPwd(e.target.value)} placeholder="再次输入新密码"
            />
          </div>
          <button
            className="btn-primary w-full" onClick={handleChangePassword}
            disabled={loading}
          >
            {loading ? "修改中..." : "修改密码"}
          </button>
        </div>
      )}

      {/* Danger zone */}
      {activeSection === "danger" && (
        <div className="flex flex-col gap-4 max-w-sm">
          <div className="p-4 rounded-lg border border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-950/30">
            <h4 className="text-sm font-semibold text-red-700 dark:text-red-400 m-0 mb-1">危险操作</h4>
            <p className="text-xs text-red-600 dark:text-red-400 m-0">
              注销账号后，所有数据将被永久删除且无法恢复。请谨慎操作。
            </p>
          </div>
          <div>
            <label className="text-xs font-medium text-neutral-500 dark:text-neutral-400 block mb-1.5">输入密码确认</label>
            <input
              type="password" className="input-light w-full border-red-200 dark:border-red-800" value={deletePwd}
              onChange={e => setDeletePwd(e.target.value)} placeholder="输入当前密码"
            />
          </div>
          <label className="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked={deleteConfirm} onChange={e => setDeleteConfirm(e.target.checked)}
              className="rounded border-neutral-300 dark:border-neutral-600 text-red-600" />
            <span className="text-xs text-neutral-600 dark:text-neutral-400">我确认要永久删除我的账号</span>
          </label>
          <button
            className="px-4 py-2 rounded-lg text-sm font-medium bg-red-600 hover:bg-red-700 text-white disabled:opacity-50 transition-colors"
            onClick={handleDeleteAccount} disabled={loading || !deleteConfirm}
          >
            {loading ? "注销中..." : "永久注销账号"}
          </button>
        </div>
      )}

      {/* Logout */}
      <div className="mt-auto pt-6 border-t border-neutral-200 dark:border-neutral-700">
        <button
          className="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors w-full"
          onClick={onLogout}
        >
          <IconLogout className="h-4 w-4" />
          退出登入
        </button>
      </div>
    </div>
  );
};

/* ════════════════════════════════════════════════════════════════════════════
   8. 数据库连接 — connect / test / list / disconnect databases
   ════════════════════════════════════════════════════════════════════════════ */
const DB_TYPES = [
  { value: "sqlite", label: "SQLite", fields: ["path"], defaults: { path: "./data/app.db" } },
  { value: "postgresql", label: "PostgreSQL", fields: ["host","port","user","password","database"], defaults: { host: "127.0.0.1", port: 5432, user: "postgres", password: "", database: "postgres" } },
  { value: "mysql", label: "MySQL", fields: ["host","port","user","password","database"], defaults: { host: "127.0.0.1", port: 3306, user: "root", password: "", database: "mysql" } },
  { value: "duckdb", label: "DuckDB", fields: ["path"], defaults: { path: "./data/app.duckdb" } },
  { value: "clickhouse", label: "ClickHouse", fields: ["host","port","user","password","database"], defaults: { host: "127.0.0.1", port: 8123, user: "default", password: "", database: "default" } },
  { value: "snowflake", label: "Snowflake", fields: ["host","port","user","password","database"], defaults: { host: "", port: 443, user: "", password: "", database: "" } },
  { value: "starrocks", label: "StarRocks", fields: ["host","port","user","password","database"], defaults: { host: "127.0.0.1", port: 9030, user: "root", password: "", database: "" } },
  { value: "bigquery", label: "BigQuery", fields: ["path"], defaults: { path: "./service-account.json" } },
  { value: "redshift", label: "Redshift", fields: ["host","port","user","password","database"], defaults: { host: "", port: 5439, user: "", password: "", database: "" } },
  { value: "databricks", label: "Databricks", fields: ["host","port","path"], defaults: { host: "", port: 443, path: "" } },
  { value: "trino", label: "Trino", fields: ["host","port","user","database"], defaults: { host: "127.0.0.1", port: 8080, user: "trino", database: "" } },
];

const FIELD_LABELS = { host: "主机", port: "端口", user: "用户名", password: "密码", database: "数据库名", path: "路径" };
const FIELD_TYPES = { host: "text", port: "number", user: "text", password: "password", database: "text", path: "text" };

const ConnectPanel = ({ onDbChange }) => {
  const [dbType, setDbType] = useState("sqlite");
  const [alias, setAlias] = useState("");
  const [config, setConfig] = useState({ path: "./data/app.db" });
  const [connecting, setConnecting] = useState(false);
  const [testing, setTesting] = useState(false);
  const [msg, setMsg] = useState(null);
  const [databases, setDatabases] = useState([]);
  const [loadingList, setLoadingList] = useState(true);
  const [catalogs, setCatalogs] = useState(null); // available databases from test
  const [expandedDb, setExpandedDb] = useState(null); // expanded database card
  const [dbPreviewData, setDbPreviewData] = useState({}); // { dbId: { tables, ... } }
  const notify = useNotify();

  const typeDef = DB_TYPES.find(d => d.value === dbType) || DB_TYPES[0];

  const refreshList = useCallback(() => {
    setLoadingList(true);
    api.databases().then(data => {
      setDatabases(data.databases || []);
    }).catch(() => setDatabases([])).finally(() => setLoadingList(false));
  }, []);

  useEffect(() => { refreshList(); }, [refreshList]);

  const handleTypeChange = (t) => {
    setDbType(t);
    const def = DB_TYPES.find(d => d.value === t) || DB_TYPES[0];
    const cfg = {};
    def.fields.forEach(f => { cfg[f] = def.defaults[f] || ""; });
    setConfig(cfg);
    setAlias("");
    setMsg(null);
    setCatalogs(null);
  };

  const updateField = (f, v) => {
    setConfig(prev => ({ ...prev, [f]: f === "port" ? parseInt(v) || 0 : v }));
  };

  const handleTest = async () => {
    setTesting(true); setMsg(null); setCatalogs(null);
    try {
      const res = await api.testDb({ db_type: dbType, config });
      const catList = res.catalogs || [];
      const msgText = res.message || "连接成功" + (catList.length ? ` (${catList.length} 个数据库可用)` : "");
      setMsg({ type: "ok", text: msgText });
      notify(msgText, 'ok');
      if (catList.length) setCatalogs(catList);
    } catch (e) {
      setMsg({ type: "err", text: e.message || "连接失败" });
      notify(e.message || "连接失败", 'error');
    } finally { setTesting(false); }
  };

  const handleConnect = async () => {
    if (!alias.trim()) { setMsg({ type: "err", text: "请输入别名" }); return; }
    setConnecting(true); setMsg(null);
    try {
      const res = await api.connectDb({ db_type: dbType, config, alias: alias.trim() });
      setMsg({ type: "ok", text: "已连接 · " + res.db_id });
      notify(`已连接 ${alias.trim()} (${dbType})`, 'ok');
      refreshList();
      if (onDbChange) onDbChange();
      // Auto-fetch schema preview
      setTimeout(() => {
        api.schema(res.db_id).then(data => {
          setDbPreviewData(prev => ({ ...prev, [res.db_id]: data }));
        }).catch(() => {});
      }, 500);
    } catch (e) {
      setMsg({ type: "err", text: e.message || "连接失败" });
      notify(e.message || "连接失败", 'error');
    } finally { setConnecting(false); }
  };

  const handleDisconnect = async (dbId) => {
    try {
      await api.disconnectDb(dbId);
      setExpandedDb(null);
      setDbPreviewData(prev => { const n = {...prev}; delete n[dbId]; return n; });
      refreshList();
      if (onDbChange) onDbChange();
      notify("已断开数据库连接", 'ok');
    } catch (e) {
      setMsg({ type: "err", text: e.message || "断开失败" });
      notify(e.message || "断开失败", 'error');
    }
  };

  const handleToggleDb = async (dbId) => {
    if (expandedDb === dbId) {
      setExpandedDb(null);
      return;
    }
    setExpandedDb(dbId);
    if (!dbPreviewData[dbId]) {
      try {
        const data = await api.schema(dbId);
        setDbPreviewData(prev => ({ ...prev, [dbId]: data }));
      } catch(e) { /* ignore */ }
    }
  };

  const handleSelectCatalog = (catName) => {
    updateField("database", catName);
    setCatalogs(null);
  };

  return (
    <div className="flex flex-col gap-6">
      <PanelHeader title="数据库连接" desc="配置和管理外部数据库连接">
        <span className="status-badge">
          <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-dot" />
          {databases.length} 个已连接
        </span>
      </PanelHeader>

      <Card className="p-5">
        <h3 className="text-sm font-semibold text-neutral-700 dark:text-neutral-300 m-0 mb-4">连接新数据库</h3>

        <div className="flex items-center gap-2 mb-4 flex-wrap">
          {DB_TYPES.map(d => (
            <button key={d.value}
              className={cn("btn-outline", dbType === d.value && "active")}
              onClick={() => handleTypeChange(d.value)}
            >{d.label}</button>
          ))}
        </div>

        <div className="mb-3">
          <label className="block text-xs font-medium text-neutral-500 dark:text-neutral-400 mb-1">别名 <span className="text-red-400">*</span></label>
          <input className="input-light" placeholder="例如: 生产库、分析库" value={alias}
            onChange={e => setAlias(e.target.value)} />
        </div>

        <div className="grid grid-cols-2 gap-3 mb-4">
          {typeDef.fields.map(f => {
            const isDbField = f === "database";
            const hasCatalogs = isDbField && catalogs && catalogs.length > 0;
            return (
            <div key={f} className={f === "path" || f === "database" ? "col-span-2" : ""}>
              <label className="block text-xs font-medium text-neutral-500 dark:text-neutral-400 mb-1">
                {FIELD_LABELS[f] || f}
                {hasCatalogs && <span className="ml-1 text-emerald-500">({catalogs.length} 个可用)</span>}
              </label>
              <div className="flex gap-2">
                <input
                  type={FIELD_TYPES[f] || "text"}
                  className="input-light flex-1"
                  placeholder={typeDef.defaults[f] !== undefined ? String(typeDef.defaults[f]) : (FIELD_LABELS[f] || f)}
                  value={config[f] !== undefined ? config[f] : ""}
                  onChange={e => updateField(f, e.target.value)}
                />
                {isDbField && (
                  <button className="btn-outline text-xs" onClick={handleTest} disabled={testing} title="测试连接并获取数据库列表">
                    {testing ? "…" : "浏览"}
                  </button>
                )}
              </div>
              {hasCatalogs && (
                <div className="mt-2 flex flex-wrap gap-1">
                  {catalogs.map(c => (
                    <button key={c} className="text-[11px] px-2 py-1 rounded-full bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/20 cursor-pointer hover:bg-emerald-100 dark:hover:bg-emerald-500/20"
                      onClick={() => handleSelectCatalog(c)}>
                      {c}
                    </button>
                  ))}
                </div>
              )}
            </div>
            );
          })}
        </div>

        <div className="flex items-center gap-2 flex-wrap">
          <button className="btn-outline" onClick={handleTest} disabled={testing}>
            {testing ? "测试中…" : "测试连接"}
          </button>
          <button className="btn-dark" onClick={handleConnect} disabled={connecting}>
            {connecting ? "连接中…" : "连接数据库"}
          </button>
        </div>

        {msg && (
          <div className={cn("mt-3 text-xs px-3 py-2 rounded-lg font-medium",
            msg.type === "ok" ? "bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400" : "bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400")}>
            {msg.text}
          </div>
        )}
      </Card>

      <Card className="p-5">
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-sm font-semibold text-neutral-700 dark:text-neutral-300 m-0">
            已连接数据库
            {databases.length > 0 && <span className="ml-2 text-xs font-normal text-neutral-400">{databases.length} 个</span>}
          </h3>
          <button className="icon-btn" onClick={refreshList} title="刷新列表"><IconRefresh className="h-4 w-4" /></button>
        </div>

        {loadingList ? (
          <p className="text-sm text-neutral-400">加载中…</p>
        ) : databases.length === 0 ? (
          <div className="text-center py-8">
            <IconDatabase className="h-8 w-8 text-neutral-300 dark:text-neutral-600 mx-auto mb-2" />
            <p className="text-sm text-neutral-400 m-0">暂无已连接数据库</p>
            <p className="text-xs text-neutral-400 mt-1 m-0">请在上方填写连接信息并点击"连接数据库"</p>
          </div>
        ) : (
          <div className="flex flex-col gap-2">
            {databases.map(db => {
              const preview = dbPreviewData[db.db_id];
              const isExpanded = expandedDb === db.db_id;
              const tableCount = preview?.table_count ?? (preview?.tables ? Object.keys(preview.tables).length : null);
              return (
                <div key={db.db_id}>
                  <div className={cn("flex items-center gap-3 px-3 py-2.5 rounded-lg bg-neutral-50 dark:bg-neutral-800/50 border border-neutral-100 dark:border-neutral-800 cursor-pointer hover:bg-neutral-100 dark:hover:bg-neutral-800",
                    isExpanded && "ring-2 ring-neutral-900/10 dark:ring-neutral-100/10")}
                    onClick={() => handleToggleDb(db.db_id)}>
                    <span className={cn("w-2 h-2 rounded-full flex-shrink-0", db.status === "connected" ? "bg-emerald-500 pulse-dot" : "bg-red-400")} />
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm font-medium text-neutral-800 dark:text-neutral-200 truncate">{db.alias || db.db_id}</span>
                        <span className="text-[11px] font-mono bg-neutral-200 dark:bg-neutral-700 text-neutral-500 dark:text-neutral-400 px-1.5 py-0.5 rounded">{db.db_type}</span>
                        {db.database_name && <span className="text-[11px] text-neutral-400 font-mono">{db.database_name}</span>}
                      </div>
                      <div className="text-[11px] text-neutral-400 truncate mt-0.5 font-mono">{db.db_id}</div>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      {tableCount !== null && <span className="text-[10px] text-neutral-400">{tableCount} 表</span>}
                      <button className="icon-btn !text-red-400 hover:!text-red-600 hover:!bg-red-50 dark:hover:!bg-red-500/10" onClick={(e) => { e.stopPropagation(); handleDisconnect(db.db_id); }} title="断开连接">
                        <IconTrash className="h-3.5 w-3.5" />
                      </button>
                      <IconChevron className={cn("h-4 w-4 text-neutral-400 transition-transform", isExpanded && "rotate-90")} />
                    </div>
                  </div>

                  {/* Expanded preview */}
                  {isExpanded && (
                    <div className="ml-4 mt-1 pl-4 border-l-2 border-neutral-200 dark:border-neutral-700 space-y-1.5 py-2">
                      {preview ? (
                        preview.tables ? (
                          <div>
                            <div className="text-[10px] font-medium text-neutral-400 uppercase tracking-wider mb-2">
                              数据表预览 ({Object.keys(preview.tables).length})
                            </div>
                            {Object.entries(preview.tables).slice(0, 10).map(([name, t]) => (
                              <div key={name} className="flex items-center justify-between text-xs py-1 px-2 rounded hover:bg-gray-50 dark:hover:bg-neutral-800/50">
                                <span className="text-neutral-700 dark:text-neutral-300 font-mono">{name}</span>
                                <span className="text-neutral-400">{t.column_count || (t.columns?.length || 0)} 列</span>
                              </div>
                            ))}
                            {Object.keys(preview.tables).length > 10 && (
                              <div className="text-[10px] text-neutral-400 italic px-2">… 等 {Object.keys(preview.tables).length} 个表</div>
                            )}
                          </div>
                        ) : (
                          <p className="text-xs text-neutral-400">加载中…</p>
                        )
                      ) : (
                        <p className="text-xs text-neutral-400">加载中…</p>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </Card>
    </div>
  );
};

/* ════════════════════════════════════════════════════════════════════════════
   Global Notification System
   ════════════════════════════════════════════════════════════════════════════ */
const NotifContext = createContext(() => {});

const useNotify = () => {
  const ctx = useContext(NotifContext);
  if (!ctx) return () => {};
  return ctx;
};

const NotifProvider = ({ children }) => {
  const [notifs, setNotifs] = useState([]);

  const notify = useCallback((message, type = 'info', duration = 4000) => {
    const id = 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    setNotifs(n => [...n, { id, message, type }]);
    if (duration > 0) {
      setTimeout(() => {
        setNotifs(n => n.filter(x => x.id !== id));
      }, duration);
    }
    return id;
  }, []);

  const dismiss = useCallback((id) => {
    setNotifs(n => n.filter(x => x.id !== id));
  }, []);

  return (
    <NotifContext.Provider value={notify}>
      {children}
      {/* Toast container */}
      <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm">
        <AP>
          {notifs.map(n => (
            <MDiv key={n.id}
              initial={{ opacity: 0, y: 20, scale: 0.95 }}
              animate={{ opacity: 1, y: 0, scale: 1 }}
              exit={{ opacity: 0, y: -10, scale: 0.95 }}
              transition={{ duration: 0.2 }}
              className={cn(
                "px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2 cursor-pointer",
                n.type === 'error' ? "bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800" :
                n.type === 'ok' ? "bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800" :
                n.type === 'warn' ? "bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800" :
                "bg-white dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 border border-neutral-200 dark:border-neutral-700"
              )}
              onClick={() => dismiss(n.id)}
            >
              <span className="flex-shrink-0">
                {n.type === 'error' ? <IconAlert className="h-4 w-4" /> :
                 n.type === 'ok' ? <IconCheck className="h-4 w-4" /> :
                 n.type === 'warn' ? <IconAlert className="h-4 w-4" /> :
                 <IconSparkles className="h-4 w-4" />}
              </span>
              <span className="flex-1">{n.message}</span>
              <button className="text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-200 bg-transparent border-none cursor-pointer p-0">
                <IconClose className="h-3 w-3" />
              </button>
            </MDiv>
          ))}
        </AP>
      </div>
    </NotifContext.Provider>
  );
};

/* ════════════════════════════════════════════════════════════════════════════
   Main App
   ════════════════════════════════════════════════════════════════════════════ */
const PANELS = {
  query:     { label: "智能查询",   icon: <IconChat /> },
  schema:    { label: "数据Schema", icon: <IconSchema /> },
  connect:   { label: "数据库连接", icon: <IconPlug /> },
  domain:    { label: "领域知识",   icon: <IconDomain /> },
  workbench: { label: "SQL工作台",  icon: <IconWorkbench /> },
  mcp:       { label: "MCP服务",    icon: <IconMcp /> },
  workflow:  { label: "工作流",     icon: <IconWorkflow /> },
  learning:  { label: "持续学习",   icon: <IconSparkles /> },
  settings:  { label: "系统设置",   icon: <IconSettings /> },
  user:      { label: "用户设置",   icon: <IconUser /> },
};

const DEFAULT_SQL = "SELECT * FROM users LIMIT 10;";

const App = () => {
  const [open, setOpen] = useState(false);
  const [activePanel, setActivePanel] = useState("query");
  const [workbenchSql, setWorkbenchSql] = useState(DEFAULT_SQL);
  const [dbVersion, setDbVersion] = useState(0);
  const [panelRefreshKey, setPanelRefreshKey] = useState(0);
  const [userRefreshKey, setUserRefreshKey] = useState(0);
  const bumpDb = () => setDbVersion(v => v + 1);

  let userName = "用户账户";
  let userAvatar = "";
  try {
    const u = JSON.parse(localStorage.getItem("nl2sql_user") || "null");
    if (u && u.username) {
      userName = u.username;
      if (u.avatar_url) {
        userAvatar = u.avatar_url.startsWith("http") ? u.avatar_url : `${API_BASE}${u.avatar_url}`;
      }
    }
  } catch (e) { /* ignore */ }

  const links = Object.entries(PANELS).map(([key, p]) => ({
    label: p.label, href: "#" + key, icon: p.icon, key,
  }));

  const handleLogout = () => {
    localStorage.removeItem("nl2sql_token");
    localStorage.removeItem("nl2sql_user");
    window.location.href = "/";
  };

  const handleUserUpdate = (updates) => {
    try {
      const u = JSON.parse(localStorage.getItem("nl2sql_user") || "{}");
      Object.assign(u, updates);
      localStorage.setItem("nl2sql_user", JSON.stringify(u));
      setUserRefreshKey(k => k + 1);
    } catch (_) {}
  };

  const handleSendToWorkbench = (sql) => {
    setWorkbenchSql(sql);
    setActivePanel("workbench");
    setPanelRefreshKey(k => k + 1);
  };

  const switchPanel = (key) => {
    setActivePanel(key);
    setPanelRefreshKey(k => k + 1);
  };

  const renderPanel = () => {
    switch (activePanel) {
      case "query":     return <ChatPanel key={panelRefreshKey} userName={userName} onSendToWorkbench={handleSendToWorkbench} />;
      case "schema":    return <SchemaPanel key={dbVersion} />;
      case "connect":   return <ConnectPanel onDbChange={bumpDb} />;
      case "domain":    return <DomainPanel />;
      case "workbench": return <WorkbenchPanel key={panelRefreshKey} sql={workbenchSql} setSql={setWorkbenchSql} />;
      case "mcp":       return <McpPanel />;
      case "workflow":  return <WorkflowPanel key={panelRefreshKey} />;
      case "learning":  return <LearningPanel key={panelRefreshKey} />;
      case "settings":  return <SettingsPanel userName={userName} onLogout={handleLogout} />;
      case "user":      return <UserSettingsPanel key={userRefreshKey} userName={userName} userAvatar={userAvatar} onLogout={handleLogout} onUserUpdate={handleUserUpdate} />;
      default:          return null;
    }
  };

  return (
    <div className={cn(
      "flex flex-col md:flex-row bg-gray-100 dark:bg-neutral-800 w-full flex-1 overflow-hidden",
      "h-screen"
    )}>
      <Sidebar open={open} setOpen={setOpen} animate={true}>
        <SidebarBody className="justify-between gap-10">
          <div className="flex flex-col flex-1 overflow-y-auto overflow-x-hidden">
            {open ? <Logo /> : <LogoIcon />}
            <div className="mt-8 flex flex-col gap-2">
              {links.map((link) => (
                <SidebarLink
                  key={link.key}
                  link={link}
                  active={activePanel === link.key}
                  onClick={() => switchPanel(link.key)}
                />
              ))}
            </div>
          </div>
          <div className="flex flex-col gap-1">
            <SidebarLink
              link={{
                label: userName,
                href: "#user",
                icon: (
                  <img
                    src={userAvatar || "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=50&h=50&fit=crop&crop=face"}
                    className="h-7 w-7 flex-shrink-0 rounded-full object-cover"
                    alt="Avatar"
                  />
                ),
              }}
              onClick={() => switchPanel("user")}
            />
            <SidebarLink
              link={{ label: "退出登入", href: "/", icon: <IconLogout /> }}
              onClick={handleLogout}
            />
          </div>
        </SidebarBody>
      </Sidebar>

      <div className="flex flex-1 min-w-0">
        <div
          className="p-2 md:p-8 md:rounded-tl-2xl border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 flex flex-col flex-1 w-full h-full overflow-hidden"
          key={activePanel}
        >
          <div className="panel-enter flex flex-col flex-1 min-h-0 overflow-auto">
            {renderPanel()}
          </div>
        </div>
      </div>
    </div>
  );
};

/* ════════════════════════════════════════════════════════════════════════════
   Render
   ════════════════════════════════════════════════════════════════════════════ */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<NotifProvider><App /></NotifProvider>);
</script>
</body>
</html>
