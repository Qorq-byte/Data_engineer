<style>
/* ===== Base ===== */
html, body { height: 100%; width: 100%; margin: 0; }
body { font-family: 'Barlow', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
#root { height: 100%; width: 100%; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }
@media (prefers-color-scheme: dark) {
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); }
}

@keyframes panelIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.panel-enter { animation: panelIn 0.2s ease forwards; }
.msg-enter { animation: panelIn 0.25s ease forwards; }

.input-light {
  width: 100%; box-sizing: border-box;
  background: #fff; border: 1px solid #e5e5e5; border-radius: 8px;
  color: #171717; padding: 9px 13px; font-size: 14px; outline: none;
  transition: border-color 0.2s;
}
.input-light:focus { border-color: #a3a3a3; }
.input-light::placeholder { color: #a3a3a3; }
@media (prefers-color-scheme: dark) {
  .input-light { background: #262626; border-color: #404040; color: #e5e5e5; }
  .input-light:focus { border-color: #737373; }
}

.table-light { width: 100%; border-collapse: collapse; font-size: 13px; }
.table-light th { text-align: left; padding: 8px 12px; color: #737373; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e5e5e5; white-space: nowrap; }
.table-light td { padding: 8px 12px; color: #404040; border-bottom: 1px solid #f5f5f5; white-space: nowrap; }
.table-light tr:hover td { background: #fafafa; }
@media (prefers-color-scheme: dark) {
  .table-light th { border-bottom-color: #404040; }
  .table-light td { color: #d4d4d4; border-bottom-color: #2a2a2a; }
  .table-light tr:hover td { background: #262626; }
}

.btn-dark {
  background: #171717; color: #fff; border: none; border-radius: 9999px;
  padding: 8px 20px; font-size: 14px; font-weight: 500; cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
}
.btn-dark:hover { background: #404040; }
.btn-dark:disabled { opacity: 0.5; cursor: default; }
@media (prefers-color-scheme: dark) {
  .btn-dark { background: #e5e5e5; color: #171717; }
  .btn-dark:hover { background: #ffffff; }
}

.btn-outline {
  background: #fff; color: #525252; border: 1px solid #d4d4d4; border-radius: 9999px;
  padding: 7px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
}
.btn-outline:hover { background: #f5f5f5; border-color: #a3a3a3; }
.btn-outline.active { background: #171717; color: #fff; border-color: #171717; }
@media (prefers-color-scheme: dark) {
  .btn-outline { background: #262626; color: #a3a3a3; border-color: #404040; }
  .btn-outline:hover { background: #333333; border-color: #737373; }
  .btn-outline.active { background: #e5e5e5; color: #171717; border-color: #e5e5e5; }

.icon-btn {
  background: transparent; border: none; padding: 8px; border-radius: 8px;

.icon-btn:hover { background: #f5f5f5; color: #171717; }

.send-btn {

.send-btn:hover:not(:disabled) { background: #171717; color: #fff; }

  .send-btn { background: #262626; border-color: #404040; color: #e5e5e5; }

.bubble-user {

}
@media (prefers-color-scheme: dark) {

}
.avatar-ai {

@media (prefers-color-scheme: dark) {

.code-card { background: #0a0a0a; border-radius: 12px; overflow: hidden; border: 1px solid #262626; }

.code-card pre {

.code-btn {
  background: transparent; border: 1px solid #404040; color: #a3a3a3; border-radius: 9999px;

.cmd-badge {
  display: inline-flex; align-items: center; gap: 4px; background: #f5f5f5;
  color: #525252; border-radius: 9999px; padding: 3px 10px; font-size: 12px; cursor: pointer;

.status-badge {

  border-radius: 9999px; padding: 4px 12px; white-space: nowrap;
}
@media (prefers-color-scheme: dark) {
  .status-badge { background: #262626; border-color: #404040; color: #a3a3a3; }
}

@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }
.pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }

<script>
window.Motion = window.FramerMotion;
var _origError = console.error;
console.error = function() {
  var m = arguments[0];
  if (typeof m === 'string' && /Warning:/.test(m)) return;
  _origError.apply(console, arguments);
};
</script>

<script type="text/babel">
const { useState, useContext, createContext, Fragment, useRef, useEffect, useCallback } = React;
const M = window.Motion;
const motion = M ? M.motion : null;
const AnimatePresence = M ? M.AnimatePresence : Fragment;

const MDiv = motion ? motion.div : 'div';
const MSpan = motion ? motion.span : 'span';
const AP = AnimatePresence;

const cn = (...args) => args.filter(Boolean).join(" ");

/* ════════════════════════════════════════════════════════════════════════════
   API Client — connects to FastAPI backend on localhost:8000
   Gracefully degrades to mock data when backend is unreachable.
   ════════════════════════════════════════════════════════════════════════════ */
const API_BASE = (() => {
  // Use the same origin (relative path) so the frontend works on any host.
  // When the page is served by the FastAPI backend, relative URLs resolve to
  // the same origin automatically — no hardcoded localhost needed.
  return '';
})();

const api = {
  _offline: false,
  _token() {
    return localStorage.getItem('nl2sql_token') || '';
  },
  _headers(json) {
    const h = {};
    if (json) h['Content-Type'] = 'application/json';
    const t = api._token();
    if (t) h['Authorization'] = `Bearer ${t}`;
    return h;
  },
  async _fetch(path, opts = {}) {
    const url = `${API_BASE}${path}`;
    const timeout = opts.timeout || 30000;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    // Merge signal if provided
    const origSignal = opts.signal;
    if (origSignal) origSignal.addEventListener('abort', () => controller.abort());
    try {
      const res = await fetch(url, { ...opts, signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) {
        let errBody = {};
        try { errBody = await res.json(); } catch(_) {}
        const code = errBody.error?.code || errBody.code || `HTTP_${res.status}`;
        const msg = errBody.error?.message || errBody.detail || errBody.message || res.statusText;
        const e = new Error(msg);
        e.code = code;
        e.status = res.status;
        e.body = errBody;
        throw e;
      }
      api._offline = false;
      return await res.json();
    } catch (e) {
      clearTimeout(timer);
      if (e.name === 'AbortError' && !origSignal) {
        const err = new Error('API_TIMEOUT');
        err.code = 'API_TIMEOUT';
        throw err;
      }
      if (e.name === 'TypeError' && (e.message.includes('fetch') || e.message.includes('NetworkError'))) {
        api._offline = true;
        const err = new Error('API_OFFLINE');
        err.code = 'API_OFFLINE';
        throw err;
      }
      throw e;
    }
  },
  /** Check if the API is online */
  async isOnline() {
    try { await api.health(); api._offline = false; return true; } catch(e) { api._offline = true; return false; }
  },
  /** Returns true if the last request was offline */
  isOffline() { return api._offline; },

  // ── Health ──
  health() { return api._fetch('/health'); },

  // ── Auth ──
  login(email, password) {
    return api._fetch('/api/v1/auth/login', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify({ email, password }),
    });
  },
  register(username, email, password) {
    return api._fetch('/api/v1/auth/register', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify({ username, email, password }),
    });
  },
  me() { return api._fetch('/api/v1/auth/me', { headers: api._headers() }); },
  changePassword(oldPassword, newPassword) {
    return api._fetch('/api/v1/auth/password', {
      method: 'PUT', headers: api._headers(true),
      body: JSON.stringify({ old_password: oldPassword, new_password: newPassword }),
    });
  },
  async uploadAvatar(file) {
    const formData = new FormData();
    formData.append('file', file);
    const url = `${API_BASE}/api/v1/auth/avatar`;
    const token = api._token();
    const headers = {};
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(url, { method: 'POST', headers, body: formData });
    if (!res.ok) {
      let errBody = {};
      try { errBody = await res.json(); } catch(_) {}
      const msg = errBody.detail || errBody.message || res.statusText;
      throw new Error(msg);
    }
    return await res.json();
  },
  deleteAccount(password) {
    return api._fetch('/api/v1/auth/account', {
      method: 'DELETE', headers: api._headers(true),
      body: JSON.stringify({ password }),
    });
  },

  // ── Query ──
  async query(body) {
    return api._fetch('/api/v1/query', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    });
  },
  async queryStream(body, onEvent) {
    const url = `${API_BASE}/api/v1/query/stream`;
    const res = await fetch(url, {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      let event = '', data = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) event = line.slice(7).trim();
        else if (line.startsWith('data: ')) {
          data = line.slice(6);
          try { onEvent(event, JSON.parse(data)); } catch(e) { onEvent(event, data); }
        } else if (line === '' && event) {
          // End of event — already handled
        }
      }
    }
  },

  // ── Schema / Databases ──
  databases() { return api._fetch('/api/v1/databases'); },
  schema(dbId) { return api._fetch(`/api/v1/schema/${dbId}`); },
  schemaRefresh(dbId) { return api._fetch(`/api/v1/schema/${dbId}/refresh`, { method: 'POST' }); },
  schemaSearch(dbId, q) { return api._fetch(`/api/v1/schema/${dbId}/search?q=${encodeURIComponent(q)}`); },
  connectDb(body) {
    return api._fetch('/api/v1/databases/connect', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    });
  },
  testDb(body) {
    return api._fetch('/api/v1/databases/test', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    });
  },
  disconnectDb(dbId) {
    return api._fetch(`/api/v1/databases/${dbId}`, {
      method: 'DELETE', headers: api._headers(),
    });
  },
  catalogs(dbId) { return api._fetch(`/api/v1/databases/${dbId}/catalogs`); },

  // ── Domains ──
  domains() { return api._fetch('/api/v1/domains'); },
  detectDomain(queryText) {
    return api._fetch('/api/v1/domains/detect', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify({ query_text: queryText }),
    });
  },
  glossary(domainId) { return api._fetch(`/api/v1/domains/${domainId}/glossary`); },
  rules(domainId) { return api._fetch(`/api/v1/domains/${domainId}/rules`); },
  createDomain(body) {
    return api._fetch('/api/v1/domains', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    });
  },
  deleteDomain(domainId) {
    return api._fetch(`/api/v1/domains/${domainId}`, {
      method: 'DELETE', headers: api._headers(),
    });
  },
  updateDomain(domainId, body) {
    return api._fetch(`/api/v1/domains/${domainId}`, {
      method: 'PUT', headers: api._headers(true),
      body: JSON.stringify(body),
    });
  },
  addGlossaryTerm(domainId, body) {
    return api._fetch(`/api/v1/domains/${domainId}/glossary`, {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    });
  },
  deleteGlossaryTerm(domainId, term) {
    return api._fetch(`/api/v1/domains/${domainId}/glossary/${encodeURIComponent(term)}`, {
      method: 'DELETE', headers: api._headers(),
    });
  },
  updateGlossaryTerm(domainId, term, body) {
    return api._fetch(`/api/v1/domains/${domainId}/glossary/${encodeURIComponent(term)}`, {
      method: 'PUT', headers: api._headers(true),
      body: JSON.stringify(body),
    });
  },
  addRule(domainId, body) {
    return api._fetch(`/api/v1/domains/${domainId}/rules`, {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    });
  },
  deleteRule(domainId, ruleId) {
    return api._fetch(`/api/v1/domains/${domainId}/rules/${encodeURIComponent(ruleId)}`, {
      method: 'DELETE', headers: api._headers(),
    });
  },
  updateRule(domainId, ruleId, body) {
    return api._fetch(`/api/v1/domains/${domainId}/rules/${encodeURIComponent(ruleId)}`, {
      method: 'PUT', headers: api._headers(true),
      body: JSON.stringify(body),
    });
  },

  // ── Workflows ──
  workflows() { return api._fetch('/api/v1/workflows').catch(() => ({})); },
  workflowStats() { return api._fetch('/api/v1/workflows/stats').catch(() => ({})); },

  // ── MCP ──
  mcpServers() { return api._fetch('/api/v1/mcp/servers').catch(() => ({})); },

  // ── Feedback ──
  feedback(body) {
    return api._fetch('/api/v1/feedback', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    }).catch(() => ({}));
  },
  feedbackStats() { return api._fetch('/api/v1/feedback/stats').catch(() => ({})); },
  feedbackRecent(limit) { return api._fetch(`/api/v1/feedback/recent?limit=${limit || 20}`).catch(() => ({})); },

  // ── Direct SQL Execution ──
  execute(body) {
    return api._fetch('/api/v1/execute', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    });
  },

  // ── SQL Utils ──
  sqlExplain(body) {
    return api._fetch('/api/v1/sql/explain', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    }).catch(() => ({}));
  },
  sqlTranslate(body) {
    return api._fetch('/api/v1/sql/translate', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    }).catch(() => ({}));
  },
  sqlFormat(body) {
    return api._fetch('/api/v1/sql/format', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    }).catch(() => ({}));
  },
  sqlValidate(body) {
    return api._fetch('/api/v1/sql/validate', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify(body),
    }).catch(() => ({}));
  },

  // ── Workflow traces ──
  workflowTraces(limit) { return api._fetch(`/api/v1/workflows/traces?limit=${limit || 20}`).catch(() => ({})); },
  workflowSimulate(nlText, domain) {
    return api._fetch('/api/v1/workflows/simulate', {
      method: 'POST', headers: api._headers(true),
      body: JSON.stringify({ nl_text: nlText, domain: domain || 'default' }),
    }).catch(() => ({}));
  },

  // ── Learning ──
  learningStats() { return api._fetch('/api/v1/learning/stats').catch(() => ({})); },
  learningQuality(days) { return api._fetch(`/api/v1/learning/quality?days=${days || 30}`).catch(() => ({})); },
  learningRuleCandidates(status) { return api._fetch(`/api/v1/learning/rule-candidates?status=${status || 'pending_review'}`).catch(() => ({})); },
  learningReviewRule(ruleId, action) {
    return api._fetch(`/api/v1/learning/rule-candidates/review?rule_id=${ruleId}&action=${action}`, { method: 'POST' }).catch(() => ({}));
  },

  // ── RAG Settings ──
  ragSettings() { return api._fetch('/api/v1/settings/rag').catch(() => ({})); },
  updateRagSettings(body) {
    return api._fetch('/api/v1/settings/rag', {
      method: 'PUT', headers: api._headers(true),
      body: JSON.stringify(body),
    }).catch(() => ({}));
  },
  deleteProvider(providerName) {
    return api._fetch(`/api/v1/settings/llm/providers/${encodeURIComponent(providerName)}`, {
      method: 'DELETE', headers: api._headers(),
    });
  },
};

/* ════════════════════════════════════════════════════════════════════════════
   SVG Icons
   ════════════════════════════════════════════════════════════════════════════ */
const ic = (inner, sw) => ({ className = "h-5 w-5 flex-shrink-0 text-neutral-700 dark:text-neutral-200" }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth={sw || 1.8} strokeLinecap="round" strokeLinejoin="round">{inner}</svg>
);

const IconChat = ic(<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>);
const IconSchema = ic(<Fragment><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></Fragment>);
const IconDomain = ic(<Fragment><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></Fragment>);
const IconWorkbench = ic(<Fragment><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></Fragment>);

const SidebarContext = createContext(undefined);

const useSidebar = () => {
  const context = useContext(SidebarContext);
  if (!context) { throw new Error("useSidebar must be used within a SidebarProvider"); }
  return context;
};

const SidebarProvider = ({ children, open: openProp, setOpen: setOpenProp, animate = true }) => {
  const [openState, setOpenState] = useState(false);
  const open = openProp !== undefined ? openProp : openState;
  const setOpen = setOpenProp !== undefined ? setOpenProp : setOpenState;
  return (
    <SidebarContext.Provider value={{ open, setOpen, animate }}>
      {children}
    </SidebarContext.Provider>
  );
};

const Sidebar = ({ children, open, setOpen, animate }) => (
  <SidebarProvider open={open} setOpen={setOpen} animate={animate}>
    {children}
  </SidebarProvider>
);

const SidebarBody = (props) => (
  <Fragment>
    <DesktopSidebar {...props} />
    <MobileSidebar {...props} />
  </Fragment>
);

const DesktopSidebar = ({ className, children, ...props }) => {
  const { open, setOpen, animate } = useSidebar();
  const motionProps = motion ? {
    initial: false,
    animate: { width: animate ? (open ? "300px" : "60px") : "300px" },
    transition: { duration: 0.25, ease: "easeInOut" },
  } : { style: { width: "300px" } };
  return (
    <MDiv
      className={cn("h-full px-4 py-4 hidden md:flex md:flex-col bg-neutral-100 dark:bg-neutral-800 w-[300px] flex-shrink-0", className)}
      onMouseEnter={() => setOpen(true)}
      onMouseLeave={() => setOpen(false)}
      {...motionProps} {...props}
    >
      {children}
    </MDiv>
  );
};

  const isObj = typeof rows[0] === 'object' && !Array.isArray(rows[0]);
  const keys = isObj ? Object.keys(rows[0]) : [];
  const headerCols = columns && columns.length > 0 ? columns : (isObj ? keys : rows[0].map((_, i) => `col_${i}`));
  return (
    <div className="overflow-auto rounded-lg border border-neutral-200 dark:border-neutral-700">
      <table className="table-light">
        <thead><tr>{headerCols.map((k, i) => <th key={i}>{k}</th>)}</tr></thead>

    </div>
  );

   1. 智能查询 — real NL→SQL pipeline via POST /api/v1/query
   ════════════════════════════════════════════════════════════════════════════ */
const WORKFLOW_STEPS = [
  { key: "schema_linking", label: "Schema 链接", icon: "🔗" },
  { key: "generate_sql",   label: "SQL 生成",   icon: "🤖" },
  { key: "validate_sql",   label: "SQL 验证",   icon: "✅" },
  { key: "execute_sql",    label: "SQL 执行",   icon: "▶️" },
];

const SUGGESTIONS = [
  "查询今年注册的用户中，订单数最多的前 10 位",
  "统计各品类的 GMV 与环比增长率",
  "最近 30 天的用户留存率趋势如何？",
  "哪些 SKU 的库存低于安全水位？",
];

const ChatPanel = ({ userName, onSendToWorkbench }) => {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [cmds, setCmds] = useState([]);
  const [cmdOpen, setCmdOpen] = useState(false);
  const [pending, setPending] = useState(null); // { step: 0..3 } or null
  const [online, setOnline] = useState(null); // null=checking, true, false
  const [detectedDomain, setDetectedDomain] = useState(null); // auto-detected domain
  const [database, setDatabase] = useState(""); // active database for queries (empty = all databases)
  const [dbDialect, setDbDialect] = useState("ansi"); // active DB dialect
  const [dbList, setDbList] = useState([]); // available databases for selector
  const [streamingText, setStreamingText] = useState(""); // SSE streaming text
  const [selectedModel, setSelectedModel] = useState(""); // "" = 跟随系统默认
  const [chatModels, setChatModels] = useState([]); // 可用模型列表(来自 /settings/available-models)
  const [editingSqlIdx, setEditingSqlIdx] = useState(-1); // which message is being edited
  const [editSqlText, setEditSqlText] = useState(""); // edited SQL text
  // Per-candidate editing state: key = `${msgIdx}_${candIdx}`, text = edited SQL
  const [editingCandKey, setEditingCandKey] = useState(null);
  const [editCandText, setEditCandText] = useState("");
  // Per-candidate feedback state: key = `${msgIdx}_${candIdx}`, value = 'up'|'down'|'edit'
  const [candFeedback, setCandFeedback] = useState({});
  const [showHistory, setShowHistory] = useState(false); // history sidebar toggle
  const [history, setHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem('nl2sql_query_history') || '[]'); } catch(e) { return []; }
  });
  const scrollRef = useRef(null);
  const streamRef = useRef(null); // AbortController for SSE
  const composingRef = useRef(false); // IME composition state
  const notify = useNotify();

  // ── History helpers ──
  const saveToHistory = (msgs, queryText, domain) => {
    if (msgs.length === 0) return;
    const entry = {
      id: Date.now().toString(36),
      time: new Date().toLocaleString('zh-CN'),
      queryText: queryText || msgs.find(m => m.role === 'user')?.text || '',
      domain: domain || detectedDomain || '',
      messageCount: msgs.length,
      messages: msgs,
    };
    const updated = [entry, ...history].slice(0, 50); // keep last 50
    setHistory(updated);
    try { localStorage.setItem('nl2sql_query_history', JSON.stringify(updated)); } catch(e) {}
  };

  const loadHistory = (entry) => {
    setMessages(entry.messages || []);
    if (entry.domain) setDetectedDomain(entry.domain);
    setShowHistory(false);
    notify("已加载历史对话", 'ok', 2000);
  };

  const deleteHistory = (id) => {
    const updated = history.filter(h => h.id !== id);
    setHistory(updated);
    try { localStorage.setItem('nl2sql_query_history', JSON.stringify(updated)); } catch(e) {}
    notify("已删除历史记录", 'ok', 2000);
  };

  const clearHistory = () => {
    if (!confirm('确定要清空所有历史查询吗？')) return;
    setHistory([]);
    try { localStorage.removeItem('nl2sql_query_history'); } catch(e) {}
    notify("已清空所有历史", 'ok', 2000);
  };

  const COMMANDS = [
    { id: "explain",   label: "解释 SQL",  icon: <IconBook className="h-3.5 w-3.5" /> },
    { id: "translate", label: "方言翻译",  icon: <IconLanguages className="h-3.5 w-3.5" /> },
    { id: "summarize", label: "总结结果",  icon: <IconWand className="h-3.5 w-3.5" /> },
  ];

  useEffect(() => {
    api.isOnline().then(setOnline);
    // Fetch available databases for query execution
    api.databases().then(data => {
      const dbs = data.databases || [];
      setDbList(dbs);
      if (dbs.length > 0) { setDbDialect(dbs[0].db_type || "ansi"); }
      // Don't auto-select a specific database — default to all databases
    }).catch(() => {});
    // Fetch user-configured LLM models for the model selector
    api._fetch('/api/v1/settings/available-models').then(r => {
      if (r && r.models) setChatModels(r.models.filter(m => m.available));
    }).catch(() => {});
  }, []);

  useEffect(() => {
    const el = scrollRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [messages, pending, streamingText]);

  // ── Auto-detect domain from NL text ──
  const detectDomain = async (text) => {
    try {
      const result = await api.detectDomain(text);
      const domain = result.recommendation || result.best?.domain || "ecommerce";
      setDetectedDomain(domain);
      return domain;
    } catch(e) { /* ignore */ }
    return "ecommerce";
  };

  // ── Run the real pipeline via API (with SSE streaming) ──
  const WORKFLOW_STAGES = ["parse", "retrieve", "generate", "validate", "execute"];
  const runPipeline = async (text, forceResult) => {
    // Cancel any previous stream
    if (streamRef.current) { streamRef.current.abort(); streamRef.current = null; }

    setPending({ step: 0 });
    setStreamingText("");

    // Auto-detect domain
    const domain = await detectDomain(text);

    const tick = (s) => {
      if (s < WORKFLOW_STAGES.length - 1) {
        setTimeout(() => { setPending({ step: s + 1 }); tick(s + 1); }, 380);
      }
    };
    tick(0);

    try {
      const body = {
        nl_text: text,
        domain: domain,
        database: database,
        dialect: dbDialect || "ansi",
        num_candidates: 3,
        execute: !forceResult,
        validate: true,
        link_schema: true,
        model: selectedModel || undefined,
      };

      // Try SSE streaming first
      try {
        const controller = new AbortController();
        streamRef.current = controller;

        const url = `${API_BASE}/api/v1/query/stream`;
        const res = await fetch(url, {
          method: 'POST',
          headers: api._headers(true),
          body: JSON.stringify(body),
          signal: controller.signal,
        });

        if (!res.ok) {
          throw new Error(`Stream HTTP ${res.status}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let collected = {
          sql: '', tables: [], queryId: '', workflowId: '',
          language: '', intent: '', confidence: 0,
          validation: null, execution: null,
          candidates: [], warnings: [], errors: [],
          stageHistory: [], message: '',
          source: '', sourceNote: '',
        };
        let currentEvent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop() || '';

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (line.startsWith('event: ')) {
              currentEvent = line.slice(7).trim();
            } else if (line.startsWith('data: ')) {
              const dataStr = line.slice(6);
              if (!dataStr) continue;
              try {
                const data = JSON.parse(dataStr);

                switch (currentEvent) {
                  case 'workflow':
                    collected.workflowId = data.workflow_id || '';
                    collected.stageHistory.push({ type: 'workflow', ...data });
                    break;
                  case 'stage':
                    const stageIdx = WORKFLOW_STAGES.indexOf(data.stage);
                    if (stageIdx >= 0 && data.status === 'started') {
                      setPending({ step: stageIdx });
                    }
                    collected.stageHistory.push({ type: 'stage', ...data });
                    break;
                  case 'parse':
                    if (data.query_id) collected.queryId = data.query_id;
                    collected.language = data.language || '';
                    collected.intent = data.intent || '';
                    collected.confidence = data.confidence || 0;
                    break;
                  case 'schema':
                    if (data.tables) collected.tables = data.tables;
                    // Track database info for schema events
                    if (data.database) {
                      collected.currentDatabase = data.database;
                    }
                    break;
                  case 'database':
                    // New event: indicates which database is being queried
                    collected.currentDatabase = data.name || '';
                    break;
                  case 'token':
                    if (data.text) {
                      collected.sql += data.text;
                      setStreamingText(collected.sql);
                    }
                    break;
                  case 'candidate':
                    // Support both legacy format (data.sql) and new format (data.sql_text)
                    const candData = {
                      id: data.id || ('c' + collected.candidates.length),
                      sql_text: data.sql_text || data.sql || '',
                      confidence: data.confidence || 0.9,
                      generation_mode: data.generation_mode || 'primary',
                      dialect: data.dialect || 'ansi',
                      database_name: data.database_name || '',
                      validation: data.validation || null,
                      execution: data.execution || null,
                    };
                    collected.candidates.push(candData);
                    if (candData.sql_text) {
                      collected.sql = candData.sql_text;
                      setStreamingText(candData.sql_text);
                    }
                    break;
                  case 'validation':
                    // Per-candidate validation when candidate_id is present
                    if (data.candidate_id) {
                      const target = collected.candidates.find(c => c.id === data.candidate_id);
                      if (target) {
                        target.validation = data;
                      }
                    }
                    collected.validation = data;
                    break;
                  case 'execution':
                    // Per-candidate execution when candidate_id is present
                    if (data.candidate_id) {
                      const execTarget = collected.candidates.find(c => c.id === data.candidate_id);
                      if (execTarget) {
                        execTarget.execution = data;
                      }
                    }
                    collected.execution = data;
                    break;
                  case 'ambiguity':
                    collected.warnings.push('检测到歧义: ' + (data.question || data.aspect || ''));
                    break;
                  case 'agent_trace':
                    collected.stageHistory.push({ type: 'agent_trace', ...data });
                    break;
                  case 'error':
                    collected.errors.push(data.message || '未知错误');
                    throw new Error(data.message || 'SSE error');
                  case 'warning':
                    collected.warnings.push(data.message || '');
                    break;
                  case 'done':
                  case 'complete':
                    if (data.primary_sql) collected.sql = data.primary_sql;
                    if (data.query_id) collected.queryId = data.query_id;
                    if (data.linked_tables) collected.tables = data.linked_tables;
                    if (data.message) collected.message = data.message;
                    if (data.source) collected.source = data.source;
                    if (data.source_note) collected.sourceNote = data.source_note;
                    // Merge backend candidates if provided
                    if (data.candidates && data.candidates.length > 0) {
                      collected.candidates = data.candidates;
                    }
                    break;
                  default:
                    // Handle legacy format: data.primary_sql or data.text
                    if (collected.queryId === '' && data.query_id) collected.queryId = data.query_id;
                    if (data.tables) collected.tables = data.tables;
                    if (data.primary_sql) {
                      collected.sql = data.primary_sql;
                      setStreamingText(data.primary_sql);
                    } else if (data.text) {
                      collected.sql += data.text;
                      setStreamingText(collected.sql);
                    }
                }
              } catch(e) {
                if (e.message && e.message !== 'Unexpected end of JSON input') {
                  throw e;
                }
              }
            }
          }
        }

        setPending(null);
        setStreamingText("");

        if (collected.sql) {
          const msg = {
            role: "assistant",
            kind: "result",
            feedback: null,
            queryId: collected.queryId || 'stream',
            // Preserve the original user query text so feedback submissions
            // can send it as nl_input (without this, PatternAnalyzer gets
            // empty nl_input and cannot generate rule candidates).
            text: text,
            language: collected.language || 'zh',
            intent: collected.intent || 'SELECT',
            confidence: collected.confidence || 0.9,
            summary: `查询完成 — 领域: ${domain}${collected.workflowId ? ` | 工作流: ${collected.workflowId}` : ''}`,
            candidates: collected.candidates.length > 0 ? collected.candidates : [{ id: 'c1', sql_text: collected.sql, confidence: 0.9, generation_mode: 'primary' }],
            primarySql: collected.sql,
            linkedTables: collected.tables,
            validation: collected.validation,
            execution: collected.execution,
            warnings: collected.warnings,
            errors: collected.errors,
            detectedDomain: domain,
            stageHistory: collected.stageHistory,
            source: collected.source,
            sourceNote: collected.sourceNote,
          };
          setMessages(m => { const updated = [...m, msg]; saveToHistory(updated, text, domain); return updated; });
          return;
        }

        // Handle "no relevant data" response from backend
        if (collected.message) {
          setMessages(m => [...m, {
            role: "assistant",
            kind: "error",
            text: collected.message,
          }]);
          return;
        }
      } catch(streamErr) {
        // SSE failed, fall back to regular query
        streamRef.current = null;
        if (streamErr.message !== 'API_OFFLINE' && streamErr.message !== 'SSE error') {
          console.warn('SSE stream failed, falling back to regular query:', streamErr.message);
        }
      }

      // Fallback: regular API call
      const result = await api.query(body);

      setPending(null);
      setStreamingText("");

      const msg = {
        role: "assistant",
        kind: "result",
        feedback: null,
        queryId: result.query_id,
        // Preserve the original user query text for feedback submissions.
        text: text,
        language: result.language,
        intent: result.intent,
        confidence: result.confidence,
        summary: `查询完成 — 领域: ${domain}, 语言: ${result.language}, 意图: ${result.intent}`,
        candidates: result.candidates || [],
        primarySql: result.primary_sql,
        validation: result.validation,
        linkedTables: result.linked_tables,
        linkedColumns: result.linked_columns,
        execution: result.execution,
        errors: result.errors,
        warnings: result.warnings,
        detectedDomain: domain,
        source: result.source || '',
        sourceNote: result.source_note || '',
      };

      if (result.execution && result.execution.rows) {
        msg.summary = `查询完成 — 返回 ${result.execution.row_count || result.execution.rows.length} 行。`;
      }

      setMessages(m => { const updated = [...m, msg]; saveToHistory(updated, text, domain); return updated; });
    } catch (e) {
      setPending(null);
      setStreamingText("");
      if (e.message === 'API_OFFLINE' || e.code === 'API_OFFLINE') {
        notify("API 离线，使用演示模式", 'warn', 4000);
        setMessages(m => { const mockMsg = buildMockResponse(text, forceResult); const updated = [...m, mockMsg]; saveToHistory(updated, text, 'ecommerce'); return updated; });
      } else if (e.message === 'API_TIMEOUT' || e.code === 'API_TIMEOUT') {
        notify("请求超时，请检查网络连接", 'error', 4000);
        setMessages(m => [...m, {
          role: "assistant", kind: "error",
          text: `请求超时 — 请检查网络连接后重试`,
        }]);
      } else {
        notify(`查询失败: ${e.message}`, 'error', 5000);
        setMessages(m => [...m, {
          role: "assistant", kind: "error",
          text: `查询失败: ${e.message}`,
        }]);
      }
    }
  };

  // ── Mock fallback ──
  const MOCK_SQL = `SELECT u.name,\n       u.email,\n       COUNT(o.id)          AS order_count,\n       SUM(o.total_amount)  AS gmv\nFROM users u\n  LEFT JOIN orders o ON u.id = o.user_id\nWHERE u.created_at >= '2026-01-01'\nGROUP BY u.id\nORDER BY order_count DESC\nLIMIT 10;`;

  const MOCK_ROWS = [
    { name: "张三", email: "zhang@example.com", order_count: 47, gmv: "¥128,400" },
    { name: "李四", email: "lisi@example.com", order_count: 32, gmv: "¥96,120" },
    { name: "王五", email: "wangwu@example.com", order_count: 28, gmv: "¥84,350" },
    { name: "赵六", email: "zhaoliu@example.com", order_count: 21, gmv: "¥63,980" },
    { name: "陈七", email: "chenqi@example.com", order_count: 18, gmv: "¥52,410" },
  ];

  const buildMockResponse = (text, forceResult) => {
    if (!forceResult && /最近/.test(text)) {
      return {
        role: "assistant", kind: "clarify", feedback: null,
        text: "消歧引擎检测到 1 处时间表述歧义：「最近」指代的范围是？",
        options: ["最近 7 天", "最近 30 天", "本季度", "今年"],
        original: text,
      };
    }
    const used = (id) => text.indexOf("/" + id) !== -1;
    return {
      role: "assistant", kind: "result", feedback: null, queryId: "mock",
      text: text,
      summary: "查询完成 — 返回 5 行 (离线模式)。",
      candidates: [{ id: "c1", sql_text: MOCK_SQL, confidence: 0.92, generation_mode: "primary" }],
      primarySql: MOCK_SQL,
      execution: { columns: ["name","email","order_count","gmv"], rows: MOCK_ROWS, row_count: 5 },
      validation: { passed: true, score: 0.95 },
      linkedTables: ["users", "orders"],
      warnings: ["离线模式 — 使用示范数据"],
      isMock: true,
    };
  };

  const ask = (text, forceResult) => {
    setMessages(m => [...m, { role: "user", text }]);
    runPipeline(text, forceResult);
  };

  const handleSend = () => {
    const raw = input.trim();
    if ((!raw && cmds.length === 0) || pending) return;
    const finalText = (cmds.map(c => "/" + c.id).join(" ") + " " + raw).trim();
    setInput(""); setCmds([]); setCmdOpen(false);
    ask(finalText, false);
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey && !composingRef.current) { e.preventDefault(); handleSend(); }
  };

  const handleClarify = (opt, original) => {
    ask(original.replace("最近", opt), true);
  };

  const setFeedback = (idx, val) => {
    setMessages(m => m.map((msg, i) => i === idx ? { ...msg, feedback: val } : msg));
    // Submit feedback to API
    const msg = messages[idx];
    api.feedback({
      query_id: msg.queryId || '',
      nl_input: msg.text || '',
      sql_generated: msg.primarySql || '',
      sql_final: msg.editedSql || msg.primarySql || '',
      rating: val === 'up' ? 4 : 2,
    });
  };

  // Start editing SQL for a message
  const startEditSql = (idx) => {
    const msg = messages[idx];
    setEditSqlText(msg.primarySql || msg.candidates?.[0]?.sql_text || '');
    setEditingSqlIdx(idx);
  };

  // Save edited SQL and submit feedback with diff
  const saveEditSqlAndFeedback = async (idx) => {
    const originalSql = messages[idx]?.primarySql || '';
    const editedSql = editSqlText.trim();
    setMessages(m => m.map((msg, i) => i === idx ? { ...msg, editedSql, feedback: 'edit' } : msg));
    setEditingSqlIdx(-1);
    // Submit feedback with the edited SQL as sql_final (triggers pattern analysis)
    if (editedSql && editedSql !== originalSql) {
      try {
        const res = await api.feedback({
          query_id: messages[idx]?.queryId || '',
          nl_input: messages[idx]?.text || '',
          sql_generated: originalSql,
          sql_final: editedSql,
          rating: 3,
        });
        if (res && res.status === 'recorded') {
          notify("已保存SQL修正，请到「持续学习 > 规则候选」点击刷新查看", 'ok', 4000);
        } else {
          notify("反馈提交异常，请重试", 'error', 3000);
        }
      } catch(e) {
        notify("提交反馈失败: " + (e.message || '未知错误'), 'error', 3000);
      }
    } else {
      notify("SQL未修改", 'info', 2000);
    }
  };

  // ── Per-candidate editing ───────────────────────────────────
  // Each candidate can be independently edited and rated.  This is
  // essential when the system returns multiple SQL candidates (e.g.
  // one per table) — the user needs to give feedback on EACH one,
  // not just the primary.
  const startEditCandidate = (idx, ci) => {
    const cand = messages[idx]?.candidates?.[ci];
    if (!cand) return;
    setEditCandText(cand.sql_text || '');
    setEditingCandKey(`${idx}_${ci}`);
  };

  const saveEditCandidate = async (idx, ci) => {
    const cand = messages[idx]?.candidates?.[ci];
    if (!cand) return;
    const originalSql = cand.sql_text || '';
    const editedSql = editCandText.trim();
    const key = `${idx}_${ci}`;
    setCandFeedback(prev => ({ ...prev, [key]: 'edit' }));
    setEditingCandKey(null);
    // Submit feedback with the candidate's original SQL as sql_generated
    if (editedSql && editedSql !== originalSql) {
      try {
        const res = await api.feedback({
          query_id: messages[idx]?.queryId || '',
          nl_input: messages[idx]?.text || '',
          sql_generated: originalSql,
          sql_final: editedSql,
          rating: 3,
        });
        if (res && res.status === 'recorded') {
          notify(`已保存候选 ${ci + 1} 的SQL修正，请到「持续学习 > 规则候选」点击刷新查看`, 'ok', 4000);
        } else {
          notify("反馈提交异常，请重试", 'error', 3000);
        }
      } catch(e) {
        notify("提交反馈失败: " + (e.message || '未知错误'), 'error', 3000);
      }
    } else {
      notify("SQL未修改", 'info', 2000);
    }
  };

  const rateCandidate = (idx, ci, val) => {
    const cand = messages[idx]?.candidates?.[ci];
    if (!cand) return;
    const key = `${idx}_${ci}`;
    setCandFeedback(prev => ({ ...prev, [key]: val }));
    api.feedback({
      query_id: messages[idx]?.queryId || '',
      nl_input: messages[idx]?.text || '',
      sql_generated: cand.sql_text || '',
      sql_final: cand.sql_text || '',
      rating: val === 'up' ? 4 : 2,
    });
  };

  return (
    <div className="flex flex-col w-full h-full min-h-0">
      <PanelHeader title="智能查询" desc="自然语言 → 领域感知 SQL，由 Harness 工作流确定性驱动">
        <span className="status-badge">
          <span className={cn("w-1.5 h-1.5 rounded-full", online === true ? "bg-emerald-500 pulse-dot" : online === false ? "bg-amber-500" : "bg-neutral-300")} />
          {online === true ? "API 在线" : online === false ? "离线模式" : "检测中…"}
        </span>
        {detectedDomain && <span className="status-badge font-mono text-[10px]">领域: {detectedDomain}</span>}
        <span className="status-badge font-mono">gensql_agentic</span>
        <button className={cn("btn-outline flex items-center gap-1", showHistory && "active")} onClick={() => setShowHistory(!showHistory)} title="历史查询">
          <IconClock className="h-3.5 w-3.5" /> 历史{history.length > 0 && ` (${history.length})`}
        </button>
        <button className="btn-outline" onClick={() => { setMessages([]); notify("已清空对话", 'ok', 2000); }} title="新建对话">
          + 新对话
        </button>
      </PanelHeader>

      {/* ── History Sidebar ── */}
      {showHistory && (
        <div className="flex-shrink-0 border-b border-neutral-200 dark:border-neutral-700 pb-3 mb-1 panel-enter">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-semibold text-neutral-900 dark:text-neutral-100 m-0 flex items-center gap-1.5">
              <IconClock className="h-4 w-4" /> 历史查询
            </h3>
            <div className="flex gap-1">
              {history.length > 0 && <button className="btn-outline !text-[10px] !py-1 !px-2" onClick={clearHistory}>清空全部</button>}
              <button className="icon-btn" onClick={() => setShowHistory(false)}><IconClose className="h-4 w-4" /></button>
            </div>
          </div>
          {history.length === 0 ? (
            <p className="text-xs text-neutral-400 text-center py-4">暂无历史查询记录</p>
          ) : (
            <div className="max-h-64 overflow-auto space-y-1.5">
              {history.map(h => (
                <div key={h.id} className="flex items-center gap-2 p-2.5 rounded-lg bg-gray-50 dark:bg-neutral-800 hover:bg-gray-100 dark:hover:bg-neutral-750 cursor-pointer group" onClick={() => loadHistory(h)}>
                  <div className="flex-1 min-w-0">
                    <div className="text-xs font-medium text-neutral-700 dark:text-neutral-300 truncate">{h.queryText || '(空查询)'}</div>
                    <div className="flex items-center gap-2 text-[10px] text-neutral-400 mt-0.5">
                      <span>{h.time}</span>
                      {h.domain && <span className="font-mono">{h.domain}</span>}
                      <span>{h.messageCount} 条消息</span>
                    </div>
                  </div>
                  <button className="icon-btn !p-1 opacity-0 group-hover:opacity-100 flex-shrink-0" title="删除" onClick={e => { e.stopPropagation(); deleteHistory(h.id); }}>
                    <IconTrash className="h-3.5 w-3.5 text-red-400" />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* ── Message stream ── */}
      <div ref={scrollRef} className="flex-1 overflow-y-auto min-h-0 mt-4 pr-1">
        <div className="max-w-4xl mx-auto w-full flex flex-col gap-5 pb-2">

          {messages.length === 0 && !pending && (
            <div className="flex flex-col items-center justify-center py-14 msg-enter">
              <div className="avatar-ai !w-12 !h-12 !rounded-xl mb-4"><IconSparkles className="h-6 w-6" /></div>
              <h3 className="text-lg font-semibold text-neutral-900 dark:text-neutral-100 m-0">你好，{userName}</h3>
              <p className="text-neutral-500 dark:text-neutral-400 text-sm mt-1 mb-6">用自然语言描述你的数据问题，支持中英文</p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full max-w-2xl">
                {SUGGESTIONS.map(s => (
                  <button key={s} className="chip" onClick={() => ask(s, false)}>{s}</button>
                ))}
              </div>
            </div>
          )}

          {messages.map((msg, idx) => (
            <div key={idx} className={cn("flex msg-enter", msg.role === "user" ? "justify-end" : "justify-start")}>
              {msg.role === "user" ? (
                <div className="bubble-user">{msg.text}</div>
              ) : (
                <div className="flex gap-3 w-full min-w-0">
                  <div className="avatar-ai"><IconSparkles className="h-4 w-4" /></div>
                  <div className="flex-1 min-w-0 flex flex-col gap-3">

                    {/* Error */}
                    {msg.kind === "error" && (
                      <Card className="p-4 border-red-200 dark:border-red-800">
                        <div className="flex items-center gap-2 text-sm font-medium text-red-600 dark:text-red-400 mb-2">
                          <IconAlert className="h-4 w-4" /> 错误
                        </div>
                        <p className="text-sm text-red-700/80 dark:text-red-300/80 m-0">{msg.text}</p>
                      </Card>
                    )}

                    {/* Clarify */}
                    {msg.kind === "clarify" && (
                      <div className="clarify-card">
                        <div className="flex items-center gap-2 text-sm font-medium text-amber-700 dark:text-amber-400 mb-2">
                          <IconAlert className="h-4 w-4 text-amber-500" /> 需要澄清
                        </div>
                        <p className="text-sm text-amber-800/80 dark:text-amber-300/80 m-0 mb-3">{msg.text}</p>
                        <div className="flex gap-2 flex-wrap">
                          {msg.options.map(opt => (
                            <button key={opt} className="btn-outline !py-1.5 !px-3.5 !text-xs" onClick={() => handleClarify(opt, msg.original)}>{opt}</button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Result */}
                    {msg.kind === "result" && (
                      <Fragment>
                        {/* Summary line */}
                        <div className="flex items-center gap-2 flex-wrap">
                          <p className="text-sm text-neutral-700 dark:text-neutral-300 m-0 flex items-center gap-2">
                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 flex-shrink-0" /> {msg.summary}
                          </p>
                          {msg.isMock && <span className="text-[10px] bg-amber-50 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400 px-1.5 py-0.5 rounded-full">离线数据</span>}
                          {msg.language && <span className="text-[10px] text-neutral-400 bg-gray-100 dark:bg-neutral-800 px-1.5 rounded-full">{msg.language}</span>}
                          {msg.intent && <span className="text-[10px] text-neutral-400 bg-gray-100 dark:bg-neutral-800 px-1.5 rounded-full">{msg.intent}</span>}
                        </div>

                        {/* Linked tables info */}
                        {msg.linkedTables && msg.linkedTables.length > 0 && (
                          <div className="flex items-center gap-1.5 text-xs text-neutral-400">
                            <IconSchema className="h-3 w-3" />
                            {msg.linkedTables.map(t => <span key={t} className="font-mono bg-gray-50 dark:bg-neutral-800 px-1.5 py-0.5 rounded">{t}</span>)}
                          </div>
                        )}

                        {/* SQL source note (domain / RAG / LLM auto) */}
                        {msg.sourceNote && (
                          <div className={cn(
                            "flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-lg",
                            msg.source === 'domain' && "bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-400",
                            msg.source === 'rag' && "bg-indigo-50 text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-400",
                            msg.source === 'llm_auto' && "bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-400",
                          )}>
                            <IconAlert className="h-3.5 w-3.5 flex-shrink-0" />
                            <span>{msg.sourceNote}</span>
                          </div>
                        )}

                        {/* SQL candidates */}
                        {(msg.candidates || []).map((c, ci) => (
                          <div key={`${c.id || 'c'}_${ci}`} className="flex flex-col gap-2 p-3 rounded-lg border border-neutral-200 dark:border-neutral-700">
                            <div className="flex items-center gap-2">
                              {c.database_name && (
                                <span className="text-[10px] bg-purple-50 text-purple-600 dark:bg-purple-500/10 dark:text-purple-400 px-1.5 py-0.5 rounded-full font-mono">
                                  DB: {c.database_name}
                                </span>
                              )}
                              {c.generation_mode === 'self_heal' && (
                                <span className="text-[10px] bg-amber-50 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400 px-1.5 py-0.5 rounded-full">自动修正</span>
                              )}
                              {c.generation_mode && c.generation_mode.startsWith('alt_') && (
                                <span className="text-[10px] bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400 px-1.5 py-0.5 rounded-full">备选 {c.generation_mode.replace('alt_', '')}</span>
                              )}
                              {c.confidence > 0 && (
                                <span className="text-[10px] text-neutral-400">置信度: {(c.confidence * 100).toFixed(0)}%</span>
                              )}
                            </div>
                            <SqlCard sql={c.sql_text} dialect={c.dialect || 'ansi'} onSendToWorkbench={onSendToWorkbench} />
                            {/* Per-candidate validation */}
                            {c.validation && (
                              <div className="ml-4 flex items-center gap-2 text-[11px]">
                                <span className={cn("w-1.5 h-1.5 rounded-full", c.validation.passed ? "bg-emerald-500" : "bg-red-400")} />
                                <span className="text-neutral-500">验证{c.validation.passed ? '通过' : '未通过'} · 评分 {c.validation.score?.toFixed(2)}</span>
                                {[['syntax_ok', '语法'], ['schema_valid', 'Schema'], ['type_valid', '类型']].map(([k, l]) => (
                                  <span key={k} className={cn("px-1.5 py-0.5 rounded text-[10px]", c.validation[k] ? "bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600" : "bg-red-50 dark:bg-red-500/10 text-red-500")}>
                                    {c.validation[k] ? '✓' : '✗'} {l}
                                  </span>
                                ))}
                              </div>
                            )}
                            {/* Per-candidate execution */}
                            {c.execution && c.execution.rows && c.execution.rows.length > 0 && (
                              <div className="ml-4">
                                <p className="text-[11px] text-neutral-400 mb-1">
                                  执行结果 · {c.execution.row_count || c.execution.rows.length} 行{c.execution.truncated ? ' (已截断)' : ''}
                                </p>
                                <div className="overflow-auto rounded-lg border border-neutral-200 dark:border-neutral-700 max-h-48">
                                  <table className="table-light text-[11px]">
                                    <thead><tr>{(c.execution.columns || []).map((k, i) => <th key={i}>{k}</th>)}</tr></thead>
                                    <tbody>
                                      {(c.execution.rows || []).slice(0, 5).map((row, i) => (
                                        <tr key={i}>
                                          {(c.execution.columns || []).map((k, j) => {
                                            const val = typeof row === 'object' && !Array.isArray(row) ? row[k] : (Array.isArray(row) ? row[j] : '');
                                            return <td key={j}>{String(val ?? '')}</td>;
                                          })}
                                        </tr>
                                      ))}
                                    </tbody>
                                  </table>
                                </div>
                              </div>
                            )}
                            {c.execution && c.execution.error && (
                              <div className="ml-4 text-[11px] text-red-500">执行错误: {c.execution.error}</div>
                            )}
                            {/* Per-candidate feedback buttons */}
                            <div className="flex items-center gap-1.5 text-xs text-neutral-400">
                              <span className="text-[10px] font-mono">候选 {ci + 1}</span>
                              <div className="flex-1" />
                              {candFeedback[`${idx}_${ci}`] === 'edit' ? (
                                <span className="flex items-center gap-1 text-blue-600 dark:text-blue-400">
                                  <IconCheck className="h-3.5 w-3.5" /> 已提交修正
                                </span>
                              ) : candFeedback[`${idx}_${ci}`] ? (
                                <span className="flex items-center gap-1 text-emerald-600 dark:text-emerald-400">
                                  <IconCheck className="h-3.5 w-3.5" /> 已记录
                                </span>
                              ) : (
                                <Fragment>
                                  <button className="icon-btn !p-1" onClick={() => rateCandidate(idx, ci, "up")} title="有帮助"><IconThumbUp className="h-3.5 w-3.5" /></button>
                                  <button className="icon-btn !p-1" onClick={() => rateCandidate(idx, ci, "down")} title="无帮助"><IconThumbDown className="h-3.5 w-3.5" /></button>
                                  <span className="text-neutral-300 dark:text-neutral-600">|</span>
                                  <button className="icon-btn !p-1" onClick={() => startEditCandidate(idx, ci)} title="编辑此候选的SQL"><IconWand className="h-3.5 w-3.5" /> 编辑</button>
                                  <button className="icon-btn !p-1" onClick={() => onSendToWorkbench(c.sql_text)} title="发送到工作台"><IconExternal className="h-3.5 w-3.5" /></button>
                                </Fragment>
                              )}
                            </div>
                            {/* Per-candidate edit textarea */}
                            {editingCandKey === `${idx}_${ci}` && (
                              <div className="flex flex-col gap-2 p-3 rounded-lg bg-blue-50 dark:bg-blue-500/10 border border-blue-200 dark:border-blue-800">
                                <div className="text-xs font-medium text-blue-600 dark:text-blue-400">编辑候选 {ci + 1} 的SQL</div>
                                <textarea
                                  className="w-full h-32 p-2 text-xs font-mono rounded border border-blue-300 dark:border-blue-700 bg-white dark:bg-neutral-900 text-neutral-700 dark:text-neutral-300 resize-y"
                                  value={editCandText}
                                  onChange={(e) => setEditCandText(e.target.value)}
                                  placeholder="在此编辑SQL..."
                                />
                                <div className="flex items-center gap-2">
                                  <button className="btn-primary !py-1 !px-3 !text-xs" onClick={() => saveEditCandidate(idx, ci)}>保存修正并提交</button>
                                  <button className="btn-outline !py-1 !px-3 !text-xs" onClick={() => setEditingCandKey(null)}>取消</button>
                                </div>
                              </div>
                            )}
                          </div>
                        ))}

                        {/* Primary SQL (fallback if no candidates) */}
                        {(!msg.candidates || msg.candidates.length === 0) && msg.primarySql && (
                          <SqlCard sql={msg.primarySql} dialect="ansi" onSendToWorkbench={onSendToWorkbench} />
                        )}

                        {/* Validation */}
                        {msg.validation && (
                          <Card className="p-3.5">
                            <div className="flex items-center gap-2 mb-2">
                              <span className={cn("w-1.5 h-1.5 rounded-full", msg.validation.passed ? "bg-emerald-500" : "bg-red-400")} />
                              <span className="text-xs font-medium text-neutral-500 uppercase tracking-wider">
                                验证 {msg.validation.passed ? '通过' : '未通过'} · 评分 {msg.validation.score?.toFixed(2)}
                              </span>
                            </div>
                            <div className="grid grid-cols-3 gap-2 text-[11px]">
                              {[['syntax_ok', '语法'], ['schema_valid', 'Schema'], ['type_valid', '类型']].map(([k, l]) => (
                                <div key={k} className={cn("flex items-center gap-1 px-2 py-1 rounded", msg.validation[k] ? "bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600" : "bg-red-50 dark:bg-red-500/10 text-red-500")}>
                                  {msg.validation[k] ? <IconCheck className="h-3 w-3" /> : <IconAlert className="h-3 w-3" />} {l}
                                </div>
                              ))}
                            </div>
                          </Card>
                        )}

                        {/* Execution result */}
                        {msg.execution && msg.execution.rows && msg.execution.rows.length > 0 && (
                          <Fragment>
                            <p className="text-xs text-neutral-400">
                              执行结果 · {msg.execution.row_count || msg.execution.rows.length} 行{msg.execution.truncated ? ' (已截断)' : ''}
                            </p>
                            <ResultTable rows={msg.execution.rows} columns={msg.execution.columns} />
                          </Fragment>
                        )}

                        {/* Warnings */}
                        {msg.warnings && msg.warnings.length > 0 && (
                          <div className="flex flex-col gap-1">
                            {msg.warnings.map((w, wi) => (
                              <div key={wi} className="flex items-center gap-1.5 text-xs text-amber-600 dark:text-amber-400">
                                <IconAlert className="h-3 w-3 flex-shrink-0" /> {w}
                              </div>
                            ))}
                          </div>
                        )}

                        {/* Feedback — only show message-level feedback when
                            there are NO candidates or just one candidate.
                            When multiple candidates exist, each has its own
                            per-candidate feedback buttons (see above). */}
                        {(!msg.candidates || msg.candidates.length <= 1) && (
                        <div className="flex items-center gap-1.5 text-xs text-neutral-400">
                          <span className="font-mono text-[10px]">{msg.queryId || ''}</span>
                          <div className="flex-1" />
                          {msg.feedback === 'edit' ? (
                            <span className="flex items-center gap-1 text-blue-600 dark:text-blue-400">
                              <IconCheck className="h-3.5 w-3.5" /> 已提交SQL修正至学习库
                            </span>
                          ) : msg.feedback ? (
                            <span className="flex items-center gap-1 text-emerald-600 dark:text-emerald-400">
                              <IconCheck className="h-3.5 w-3.5" /> 已记录至学习库
                            </span>
                          ) : (
                            <Fragment>
                              <span>有帮助吗？</span>
                              <button className="icon-btn !p-1.5" onClick={() => setFeedback(idx, "up")}><IconThumbUp className="h-3.5 w-3.5" /></button>
                              <button className="icon-btn !p-1.5" onClick={() => setFeedback(idx, "down")}><IconThumbDown className="h-3.5 w-3.5" /></button>
                              <span className="text-neutral-300 dark:text-neutral-600">|</span>
                              <button className="icon-btn !p-1.5" onClick={() => startEditSql(idx)} title="编辑SQL并提交修正"><IconWand className="h-3.5 w-3.5" /> 编辑SQL</button>
                            </Fragment>
                          )}
                        </div>
                        )}

                        {/* SQL Edit Area — message-level (only for single/no candidate) */}
                        {editingSqlIdx === idx && (
                          <div className="flex flex-col gap-2 p-3 rounded-lg bg-blue-50 dark:bg-blue-500/10 border border-blue-200 dark:border-blue-800">
                            <div className="text-xs font-medium text-blue-600 dark:text-blue-400">编辑SQL（修改后提交，系统将自动学习编辑模式并生成规则候选）</div>
                            <textarea
                              className="w-full h-32 p-2 text-xs font-mono rounded border border-blue-300 dark:border-blue-700 bg-white dark:bg-neutral-900 text-neutral-700 dark:text-neutral-300 resize-y"
                              value={editSqlText}
                              onChange={(e) => setEditSqlText(e.target.value)}
                              placeholder="在此编辑SQL..."
                            />
                            <div className="flex items-center gap-2">
                              <button className="btn-primary !py-1 !px-3 !text-xs" onClick={() => saveEditSqlAndFeedback(idx)}>保存修正并提交</button>
                              <button className="btn-outline !py-1 !px-3 !text-xs" onClick={() => setEditingSqlIdx(-1)}>取消</button>
                            </div>
                          </div>
                        )}
                      </Fragment>
                    )}
                  </div>
                </div>
              )}
            </div>
          ))}

          {/* Pending — harness pipeline steps */}
          {pending && (
            <div className="flex gap-3 msg-enter">
              <div className="avatar-ai"><IconSparkles className="h-4 w-4" /></div>
              <div className="flex flex-col gap-2 min-w-[240px]">
                <Card className="p-4">
                  <div className="flex flex-col gap-2.5">
                    {WORKFLOW_STEPS.map((s, i) => (
                      <div key={s.key} className={cn("flex items-center gap-2 text-xs transition-opacity", i > pending.step && "opacity-35")}>
                        {i < pending.step ? (
                          <IconCheck className="h-3.5 w-3.5 text-emerald-500 flex-shrink-0" />
                        ) : i === pending.step ? (
                          <svg className="animate-spin h-3.5 w-3.5 text-neutral-400 flex-shrink-0" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        ) : (
                          <span className="h-3.5 w-3.5 rounded-full border border-neutral-300 dark:border-neutral-600 flex-shrink-0" />
                        )}
                        <span className="text-neutral-700 dark:text-neutral-300">{s.icon} {s.label}</span>
                        <span className="text-neutral-400 font-mono text-[10px]">{s.key}</span>
                      </div>
                    ))}
                  </div>
                </Card>
                {/* Streaming SQL preview */}
                {streamingText && (
                  <Card className="p-3">
                    <div className="text-[10px] font-medium text-neutral-400 uppercase tracking-wider mb-1.5">实时生成预览</div>
                    <pre className="text-xs font-mono text-neutral-700 dark:text-neutral-300 m-0 whitespace-pre-wrap max-h-32 overflow-auto" style={{fontFamily: "'JetBrains Mono', monospace"}}>{streamingText}</pre>
                  </Card>
                )}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* ── Input dock ── */}
      <div className="flex-shrink-0 pt-3">
        <div className="max-w-4xl mx-auto w-full">
          {cmds.length > 0 && (
            <div className="flex flex-wrap gap-1 mb-2">
              {cmds.map(c => (
                <span key={c.id} className="cmd-badge" onClick={() => setCmds(cmds.filter(x => x.id !== c.id))}>
                  {c.icon} {c.label} ✕
                </span>
              ))}
            </div>
          )}
          {/* Database selector */}
          {dbList.length > 0 && (
            <div className="flex items-center gap-2 mb-2">
              <span className="text-[11px] text-neutral-400">查询范围:</span>
              <select
                className="text-[11px] bg-transparent border border-neutral-200 dark:border-neutral-700 rounded px-2 py-1 text-neutral-600 dark:text-neutral-400 outline-none cursor-pointer"
                value={database}
                onChange={(e) => {
                  setDatabase(e.target.value);
                  const sel = dbList.find(d => d.db_id === e.target.value);
                  if (sel) setDbDialect(sel.db_type || "ansi");
                }}
              >
                <option value="">全部数据库 ({dbList.length})</option>
                {dbList.map(d => (
                  <option key={d.db_id} value={d.db_id}>{d.database_name || d.alias || d.db_id} ({d.db_type})</option>
                ))}
              </select>
            </div>
          )}
          {/* Model selector */}
          <div className="flex items-center gap-2 mb-2">
            <span className="text-[11px] text-neutral-400">模型:</span>
            <select
              className="text-[11px] bg-transparent border border-neutral-200 dark:border-neutral-700 rounded px-2 py-1 text-neutral-600 dark:text-neutral-400 outline-none cursor-pointer max-w-[240px]"
              value={selectedModel}
              onChange={(e) => setSelectedModel(e.target.value)}
              title="选择本次查询使用的大模型"
            >
              <option value="">跟随系统设置</option>
              {chatModels.map(m => (
                <option key={`${m.provider}/${m.model}`} value={m.model}>{m.model} ({m.provider})</option>
              ))}
            </select>
            {chatModels.length === 0 && (
              <span className="text-[11px] text-amber-500" title="在「系统设置 → LLM」中配置 API Key 后即可选择模型">未配置可用模型</span>
            )}
          </div>
          <div className="relative">
            {cmdOpen && (
              <Card className="absolute bottom-full mb-2 left-0 w-60 p-1.5 z-20">
                <div className="px-2 py-1.5 text-[11px] font-medium text-neutral-400 uppercase tracking-wider">指令</div>
                {COMMANDS.map(c => (
                  <button key={c.id}
                    className="w-full flex items-center gap-2 px-2 py-2 text-sm text-neutral-700 dark:text-neutral-300 bg-transparent border-none rounded-lg cursor-pointer text-left hover:bg-gray-100 dark:hover:bg-neutral-800"
                    onClick={() => { if (!cmds.find(x => x.id === c.id)) setCmds([...cmds, c]); setCmdOpen(false); }}>
                    {c.icon} {c.label}
                    <span className="ml-auto text-[10px] text-neutral-400 font-mono">/{c.id}</span>
                  </button>
                ))}
              </Card>
            )}
            <Card className="flex items-end gap-1 p-2">
              <button className="icon-btn" title="指令" onClick={() => setCmdOpen(!cmdOpen)}>
                <IconWand className="h-5 w-5" />
              </button>
              <textarea
                className="flex-1 resize-none bg-transparent border-none outline-none text-sm text-neutral-900 dark:text-neutral-100 placeholder:text-neutral-400 px-2 py-2"
                rows={2}
                placeholder="描述你的数据问题…（输入 / 唤起指令，Enter 发送）"
                value={input}
                onChange={e => { setInput(e.target.value); if (e.target.value === "/") setCmdOpen(true); }}
                onCompositionStart={() => { composingRef.current = true; }}
                onCompositionEnd={e => { composingRef.current = false; }}
                onBlur={() => { composingRef.current = false; }}
                onKeyDown={handleKeyDown}
              />
              <button className="icon-btn" title="清空" onClick={() => setInput("")}>
                <IconTrash className="h-5 w-5" />
              </button>
              <button className="send-btn" title="发送" onClick={handleSend} disabled={(!input.trim() && cmds.length === 0) || !!pending}>
                <IconSend className="h-4 w-4" />
              </button>
            </Card>
          </div>
          <p className="text-[11px] text-neutral-400 text-center mt-2 mb-0">Enter 发送 · Shift+Enter 换行 · / 唤起指令 · 支持中英文 · 11 种数据库方言</p>
        </div>
      </div>
    </div>
  );
};

/* ════════════════════════════════════════════════════════════════════════════
   2. 数据 Schema — fetches from GET /api/v1/databases & /api/v1/schema/{db_id}
   ════════════════════════════════════════════════════════════════════════════ */
const SchemaPanel = () => {
  const [expanded, setExpanded] = useState(null);
  const [dbFilter, setDbFilter] = useState("全部");
  const [databases, setDatabases] = useState([]);
  const [schemas, setSchemas] = useState({}); // { db_id: { tables: {...}, ... } }
  const [schemaErrors, setSchemaErrors] = useState({}); // { db_id: "error message" }
  const [loading, setLoading] = useState(false);
  const [loadingDb, setLoadingDb] = useState(null);
  const [refreshingDb, setRefreshingDb] = useState(null);
  const [searchQuery, setSearchQuery] = useState("");
  const [searchResults, setSearchResults] = useState(null);
  const [isOffline, setIsOffline] = useState(false);
  const [activeDbId, setActiveDbId] = useState(null);
  const [lastRefreshTime, setLastRefreshTime] = useState({});
  const [viewMode, setViewMode] = useState("tables"); // "tables" | "compare"
  const searchTimerRef = useRef(null);
  const notify = useNotify();

  // Fetch databases on mount
  useEffect(() => {
    fetchDatabases();
    const interval = setInterval(fetchDatabases, 30000); // Auto-refresh every 30s
    return () => clearInterval(interval);
  }, []);

  const fetchDatabases = () => {
    api.databases().then(data => {
      const dbs = data.databases || [];
      setDatabases(dbs);
      if (dbs.length > 0 && !activeDbId) {
        const firstDb = dbs[0].db_id;
        setActiveDbId(firstDb);
        fetchSchema(firstDb);
      }
    }).catch((e) => {
      if (e.message === 'API_OFFLINE' || e.code === 'API_OFFLINE') {
        setIsOffline(true);
        setDatabases([
          { db_id: "sqlite_main", db_type: "sqlite", alias: "main", host: ":memory:", database_name: "ecommerce.db", status: "connected" },
          { db_id: "pg_warehouse", db_type: "postgresql", alias: "warehouse", host: "localhost:5432", database_name: "warehouse", status: "connected" },
        ]);
      }
    });
  };

  const fetchSchema = async (dbId) => {
    setLoadingDb(dbId);
    setSchemaErrors(e => { const n = {...e}; delete n[dbId]; return n; });
    try {
      const data = await api.schema(dbId);
      setSchemas(s => ({ ...s, [dbId]: data }));
      setLastRefreshTime(t => ({ ...t, [dbId]: new Date().toLocaleTimeString() }));
      const tblCount = data.table_count || (data.tables ? Object.keys(data.tables).length : 0);
      notify(`Schema 已加载: ${data.database_name || dbId} (${tblCount} 表)`, 'ok', 2500);
    } catch(e) {
      if (e.message === 'API_OFFLINE') {
        setIsOffline(true);
        setSchemas(s => ({ ...s, [dbId]: {
          db_id: dbId, database_type: "sqlite", database_name: "ecommerce",
          table_count: 6,
          tables: {
            users: { name: "users", comment: "用户账户表", column_count: 8, row_count_estimate: 12400, columns: [
              { name: "id", type: "INT", nullable: false, is_primary_key: true, is_foreign_key: false, comment: "主键" },
              { name: "name", type: "VARCHAR(100)", nullable: false, is_primary_key: false, is_foreign_key: false, comment: null },
              { name: "email", type: "VARCHAR(255)", nullable: false, is_primary_key: false, is_foreign_key: false, comment: "UNIQUE" },
              { name: "created_at", type: "TIMESTAMP", nullable: false, is_primary_key: false, is_foreign_key: false, comment: null },
            ], foreign_keys: [] },
            orders: { name: "orders", comment: "订单记录表", column_count: 12, row_count_estimate: 89200, columns: [], foreign_keys: [] },
            products: { name: "products", comment: "产品目录表", column_count: 15, row_count_estimate: 3100, columns: [], foreign_keys: [] },
            order_items: { name: "order_items", comment: "订单明细表", column_count: 6, row_count_estimate: 256000, columns: [], foreign_keys: [] },
            inventory: { name: "inventory", comment: "库存表", column_count: 9, row_count_estimate: 45000, columns: [], foreign_keys: [] },
            categories: { name: "categories", comment: "产品分类表", column_count: 5, row_count_estimate: 128, columns: [], foreign_keys: [] },
          }
        }}));
        setLastRefreshTime(t => ({ ...t, [dbId]: new Date().toLocaleTimeString() }));
      } else {
        setSchemaErrors(e2 => ({ ...e2, [dbId]: e.message }));
      }
    } finally { setLoadingDb(null); }
  };

  const handleRefreshSchema = async (dbId) => {
    setRefreshingDb(dbId);
    try {
      await api.schemaRefresh(dbId);
      await fetchSchema(dbId);
      notify("Schema 已刷新", 'ok', 2000);
    } catch(e) {
      notify("Schema 刷新失败，尝试直接加载", 'warn', 3000);
      // Fallback to direct fetch
      await fetchSchema(dbId);
    } finally {
      setRefreshingDb(null);
    }
  };

  const handleSearch = async () => {
    if (!searchQuery.trim()) { setSearchResults(null); return; }
    const dbId = activeDbId || databases[0]?.db_id;
    if (!dbId) return;
    setLoading(true);
    try {
      const data = await api.schemaSearch(dbId, searchQuery);
      setSearchResults(data.results || []);
    } catch(e) {
      // Search across all loaded schemas locally
      const results = [];
      const q = searchQuery.toLowerCase();
      Object.entries(schemas).forEach(([dbId, schema]) => {
        if (!schema || !schema.tables) return;
        Object.entries(schema.tables).forEach(([name, t]) => {
          if (name.toLowerCase().includes(q)) {
            results.push({ table_name: name, comment: t.comment, column_count: t.column_count || 0, db: schema.database_name || dbId, matched_columns: [], dbId: dbId });
          }
          if (t.columns) {
            t.columns.forEach(c => {
              if (c.name.toLowerCase().includes(q) || (c.comment && c.comment.toLowerCase().includes(q))) {
                const existing = results.find(r => r.table_name === name);
                if (!existing) {
                  results.push({ table_name: name, comment: t.comment, column_count: t.column_count || 0, db: schema.database_name || dbId, dbId: dbId, matched_columns: [{ name: c.name, type: c.type, comment: c.comment }] });
                } else if (!existing.matched_columns.find(mc => mc.name === c.name)) {
                  existing.matched_columns.push({ name: c.name, type: c.type, comment: c.comment });
                }
              }
            });
          }
        });
      });
      setSearchResults(results);
    } finally { setLoading(false); }
  };

  // Debounced search
  const handleSearchInput = (value) => {
    setSearchQuery(value);
    if (searchTimerRef.current) clearTimeout(searchTimerRef.current);
    if (!value.trim()) {
      setSearchResults(null);
      return;
    }
    searchTimerRef.current = setTimeout(() => handleSearch(), 350);
  };

  const handleDbSwitch = async (dbId) => {
    setActiveDbId(dbId);
    if (!schemas[dbId]) {
      await fetchSchema(dbId);
    }
  };

  // Collect all tables from all loaded schemas
  const allTables = [];
  Object.entries(schemas).forEach(([dbId, schema]) => {
    if (!schema || !schema.tables) return;
    Object.entries(schema.tables).forEach(([name, t]) => {
      allTables.push({ ...t, db: schema.database_name || dbId, dbId: dbId, dbType: schema.database_type });
    });
  });

  const filteredTables = dbFilter === "全部"
    ? allTables
    : allTables.filter(t => t.db === dbFilter || databases.find(d => d.alias === dbFilter && d.db_id === t.dbId));
